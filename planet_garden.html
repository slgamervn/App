function storyLog(key,label,x=-1,y=-1){const sec=Math.floor(ticks*TICK);if(storyKeys[key]===sec)return;storyKeys[key]=sec;if(storyEvents.length>=STORY_MAX)storyEvents.shift();storyEvents.push({sec,label:String(label).normalize('NFC'),x,y});}
function storySample(){const sec=Math.floor(ticks*TICK);if(sec===storySampleSecond)return;storySampleSecond=sec;let temp=0,water=0;for(let i=0;i<tiles.length;i++){temp+=tiles[i].T;water+=tiles[i].W;}if(storySamples.length>=SAMPLE_MAX)storySamples.shift();storySamples.push({sec,temp:temp/Math.max(1,tiles.length),water:water/Math.max(1,tiles.length),plants:counts().p});}
function storyChain(){const a=storyEvents.slice(-4);if(!a.length)a.push({sec:Math.floor(ticks*TICK),label:loseMsg||'Hệ sinh thái mất cân bằng'});return a.map(e=>('Giây '+e.sec+': '+e.label).slice(0,200));}
function overlayColor(v,min,max){const q=clamp((v-min)/(Math.max(1e-9,max-min)),0,1);if(settings.colorblind)return 'rgb('+Math.round(25+225*q)+','+Math.round(80+170*q)+','+Math.round(220-190*q)+')';return 'rgb('+Math.round(35+220*q)+','+Math.round(95+110*Math.sin(Math.PI*q))+','+Math.round(210-190*q)+')';}
function cycleOverlay(){const max=(isSandbox||(LEVELS[lvl]&&LEVELS[lvl].chem))?5:3;overlayIndex=(overlayIndex+1)%(max+1);overlayAlpha=0;overlayLast=0;if(overlayIndex&&lvl===0&&!loadStore('p_overlay_hint',false)){saveStore('p_overlay_hint',true);triggerToast('Thử bật lớp Nhiệt độ để thấy chỗ nào sắp cháy.');}}
function updateOverlay(now){if(!overlayIndex||now-overlayLast<250)return;overlayLast=now;if(overlayCanvas.width!==cv.width||overlayCanvas.height!==cv.height){overlayCanvas.width=cv.width;overlayCanvas.height=cv.height;}const g=overlayCtx;g.setTransform(DPR,0,0,DPR,0,0);g.clearRect(0,0,W,H);let mn=Infinity,mx=-Infinity;for(let i=0;i<64;i++){const t=tiles[i],v=overlayIndex===1?t.T:overlayIndex===2?t.W:overlayIndex===3?lightAt(hs,i%N,(i/N)|0)*100:overlayIndex===4?(t.pH||7):t.P;overlayVals[i]=Number.isFinite(v)?v:0;mn=Math.min(mn,v);mx=Math.max(mx,v);}for(let i=0;i<64;i++){const x=i%N,y=(i/N)|0,p=proj(x,y);g.fillStyle=overlayColor(overlayVals[i],mn,mx);g.globalAlpha=.72;g.beginPath();g.moveTo(p[0],p[1]-lay.th/2);g.lineTo(p[0]+lay.tw/2,p[1]);g.lineTo(p[0],p[1]+lay.th/2);g.lineTo(p[0]-lay.tw/2,p[1]);g.closePath();g.fill();if(settings.colorblind&&i%2===0){g.globalAlpha=.35;g.strokeStyle='#102030';g.beginPath();g.moveTo(p[0]-6*S,p[1]-3*S);g.lineTo(p[0]+6*S,p[1]+3*S);g.stroke();}}g.globalAlpha=1;}

function parseFormula(formula){
 const str=String(formula).replace(/\s+/g,'');let i=0;
 function group(){const out={};while(i<str.length){const ch=str[i];if(ch===')'){i++;return out;}if(ch==='('){i++;const sub=group();let n='';while(/[0-9]/.test(str[i]||''))n+=str[i++];const k=n?Number(n):1;for(const e in sub)out[e]=(out[e]||0)+sub[e]*k;continue;}const m=str.slice(i).match(/^([A-Z][a-z]?)([0-9]*)/);if(!m)throw Error('Công thức không hợp lệ tại '+str.slice(i));i+=m[0].length;out[m[1]]=(out[m[1]]||0)+(m[2]?Number(m[2]):1);}return out;}
 const result=group();if(i!==str.length)throw Error('Ngoặc công thức không hợp lệ');return result;
}
function parseEquation(q){const sides=String(q).replace(/__/g,'').split(/\\rightarrow|→|->/);if(sides.length!==2)throw Error('Phương trình phải có hai vế');const parseSide=x=>x.split('+').map(part=>{const m=part.trim().match(/^(\d+)?(.*)$/);return {formula:m[2].replace(/[{}]/g,''),coef:m[1]?Number(m[1]):1,atoms:parseFormula(m[2].replace(/[{}]/g,''))};});return {left:parseSide(sides[0]),right:parseSide(sides[1])};}
function balanceStatus(eq,vals){const parsed=parseEquation(eq.q),totals=(side,offset)=>{const out={};side.forEach((x,i)=>{const k=Math.max(1,Number(vals[offset+i])||1)*x.coef;for(const e in x.atoms)out[e]=(out[e]||0)+x.atoms[e]*k;});return out;};const left=totals(parsed.left,0),right=totals(parsed.right,parsed.left.length),elements=[...new Set([...Object.keys(left),...Object.keys(right)])].sort();const balanced=elements.every(e=>(left[e]||0)===(right[e]||0));const gcd=(a,b)=>b?gcd(b,a%b):a;const g=vals.reduce((a,b)=>gcd(a,Math.abs(Number(b)||0)),0);return {balanced,simplified:g>1,elements,left,right};}
function chemPH(t){const liters=Math.max(.001,Number(t.W)||0);const h=Math.max(1e-14,1e-7+(Number(t.acidMol)||0)/liters);return clamp(-Math.log10(h),0,14);}
function updateChemPH(t){const buffer=Math.max(0,Number(t.bufferMol)||0),acid=Math.max(0,Number(t.acidMol)||0);if(buffer>0&&acid>0){const neutral=Math.min(buffer,acid);t.bufferMol-=neutral;t.acidMol-=neutral;}t.pH=chemPH(t);}

let AC=null,master=null,ambientGain=null,noiseBuf=null,activeSoundCount=0;
const lastS={};
function initAudio(){
 if(AC){if(AC.state==='suspended')try{AC.resume();}catch(e){}return;}
 try{
  AC=new (window.AudioContext||window.webkitAudioContext)();
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=6;
  master=AC.createGain();master.gain.value=muted?0:.5;
  master.connect(comp);comp.connect(AC.destination);

  noiseBuf=AC.createBuffer(1,Math.min(AC.sampleRate*2, 96000),AC.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;

 }catch(e){AC=null;}
}

function startAmbient(){
 if(!AC||!master)return;
 try{
  ambientGain=AC.createGain();
  ambientGain.gain.value=0.08;
  ambientGain.connect(master);

  const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
  const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=180;
  s.connect(fl);fl.connect(ambientGain);s.start();

  const o1=AC.createOscillator(), o2=AC.createOscillator();
  o1.type='sine';o1.frequency.value=110;
  o2.type='triangle';o2.frequency.value=164.81;
  const gPad=AC.createGain();gPad.gain.value=0.15;
  o1.connect(gPad);o2.connect(gPad);gPad.connect(ambientGain);
  o1.start();o2.start();
 }catch(e){}
}

function gate(n,gap){const t=performance.now()/1000;if(lastS[n]&&t-lastS[n]<gap)return false;lastS[n]=t;return true;}
function tone(f0,f1,dur,vol,delay,type){
 if(!AC||muted||activeSoundCount>12)return;delay=delay||0;
 try{
  activeSoundCount++;
  const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(clamp(f0,10,20000),t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);
  o.onended=()=>{activeSoundCount=Math.max(0,activeSoundCount-1);};
 }catch(e){activeSoundCount=Math.max(0,activeSoundCount-1);}
}
function noise(dur,type,f0,f1,vol,delay,q){
 if(!AC||muted||!noiseBuf||activeSoundCount>12)return;delay=delay||0;
 try{
  activeSoundCount++;
  const t=AC.currentTime+delay,s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
  const fl=AC.createBiquadFilter();fl.type=type;fl.Q.value=q||.7;

   if(tg&&a.e<90){
    stepToward(a,tg.x,tg.y);
    a.eyeDir={x:Math.sign(tg.x-a.x), y:Math.sign(tg.y-a.y)};
    if(a.x===tg.x&&a.y===tg.y){tg.dead=true;deathPuff(tg.fx,tg.fy);a.e=Math.min(100,a.e+40);sfx.chirpC();unlockFormula(12);}
   }else if(!tg||Math.random()<.4)wander(a);
  }
  if(a.e>85&&carns.length+bornC.length<3){
   a.e-=35;bornC.push(mk(a.x,a.y,50));sfx.chirpC();popAt(a.x,a.y);vibrate(30);
   heartPuff(a.x,a.y);
  }
 }
 for(const b of bornC)carns.push(b);
 herbs=herbs.filter(a=>!a.dead);carns=carns.filter(a=>!a.dead);

 if(!lowQualityMode && Math.random()<0.25){
  const j=(Math.random()*64)|0, t=tiles[j];
  if(t&&!t.des&&t.P>30){
   const [sx,sy]=proj(j%N, (j/N)|0);
   addP({k:'firefly', x:sx+(Math.random()-.5)*lay.tw, y:sy-Math.random()*30, vx:(Math.random()-.5)*8, vy:-(5+Math.random()*10), l:0, m:2+Math.random()*2, s:1.5+Math.random()});
  }
 }

 saveSnapshot();
 terrainDirty=true;

 let dc=0;for(const t of tiles)if(t.des)dc++;
 if(dc>25.6){triggerCollapse(h);return;}
 ticks++;storySample();for(let i=0;i<64;i++){if(tiles[i].T>85)storyLog('heat','ô ('+(i%N)+','+((i/N)|0)+') vượt 85 °C',i%N,(i/N)|0);if(tiles[i].pH<5)storyLog('ph','pH dưới 5 tại ô ('+(i%N)+','+((i/N)|0)+')',i%N,(i/N)|0);}if(vapor>=99)storyLog('vapor','hơi nước đạt mức tối đa');if(stormActive)storyLog('storm','bão bắt đầu');if(herbs.length===0)storyLog('herb','con ăn cỏ cuối cùng đã chết');if(carns.length===0)storyLog('carn','con ăn thịt cuối cùng đã chết');
 if(!isSandbox && ticks>=TT)finish();
}

function finish(){
 const c=counts(),g=LEVELS[lvl] ? LEVELS[lvl].g : {p:10,h:2,c:0};
 stateT=0;

 let passChem = true;
 const L = LEVELS[lvl]||LEVELS[0];
 if(L.chem){
  let sumpH = 0; for(const t of tiles) sumpH += t.pH;
  let avgpH = sumpH / 64;
  if(lvl === 9 && (c.p < g.p || c.h < g.h || avgpH < 6 || avgpH > 8)) passChem = false;
  if(lvl === 10 && (c.p < g.p || c.h < g.h || c.c < g.c)) passChem = false;
  if(lvl === 11 && (c.p < g.p || c.h < g.h || c.c < g.c || o2 < 60 || avgpH < 6 || avgpH > 8)) passChem = false;
 }

 if(c.p>=g.p&&c.h>=g.h&&c.c>=g.c && passChem){
  state='win';sfx.win();
  let stars = 1;
  if(c.p>=g.p+2 && c.h>=g.h+2 && c.c>=g.c+2) stars = 2;
  let hasDesert = false;
  for(const t of tiles) if(t.des) hasDesert = true;
  if(stars===2 && !hasDesert) stars = 3;

  levelStars[lvl] = Math.max(levelStars[lvl], stars);
  saveStore('p_stars', levelStars);
  if(lvl < 11){
   unlockedLvl = Math.max(unlockedLvl, lvl+1);
   saveStore('p_unlocked', unlockedLvl);
  }

  if(!regretCardsUnlocked.includes(lvl)){
   regretCardsUnlocked.push(lvl);
   saveStore('p_regret', regretCardsUnlocked);
  }
 }
 else{state='lose';loseMsg=pick(LOSE_TIME);}
}

 for(let i=0;i<60;i++)steam(Math.random()*7,Math.random()*7,true);

  const x=i%N,y=(i/N)|0,d=Math.hypot(x-h.x,y-h.y);

 }
}

// ---------- Sandbox & Tool Interactions ----------
function handleTileClick(gx, gy){
 if(gx<0||gx>=N||gy<0||gy>=N) return;
 const idx=gy*N+gx; const t=tiles[idx];
 if(!t) return;
 if(isSandbox&&['meteor','drought','heatwave','volcanoToy','revive'].includes(sbTool)){if(disasterCooldown>0){triggerToast('Chờ hồi chiêu '+disasterCooldown.toFixed(1)+' giây.');return;}disasterCooldown=3;if(sbTool==='meteor'){meteorWarning={x:gx,y:gy,t:1};triggerToast('Thiên thạch sắp va chạm!');return;}if(sbTool==='drought'){droughtTimer=10;triggerToast('Hạn hán: bay hơi tăng trong 10 giây.');sfx.thunder();return;}if(sbTool==='heatwave'){heatwaveTimer=10;triggerToast('Sóng nhiệt: +15 °C trong 10 giây.');sfx.sizzle();return;}if(sbTool==='volcanoToy'){t.volcano=true;t.so2Mol=(t.so2Mol||0)+.001;triggerToast('Đã đặt núi lửa.');sfx.sizzle();return;}if(sbTool==='revive'){for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const x=gx+dx,y=gy+dy;if(x<0||x>=N||y<0||y>=N)continue;const q=tiles[y*N+x];q.des=false;q.W=Math.max(q.W,65);q.T=clamp(q.T,18,32);q.P=Math.max(q.P,15);q.frozen=false;}terrainDirty=true;triggerToast('Vùng đất đã hồi sinh.');sfx.win();return;}}
 const L = LEVELS[lvl]||LEVELS[0];
 const hasChem = isSandbox || L.chem;

 if(sbTool==='water'){
  t.des=false; t.W=Math.min(100, t.W+40); t.frozen=false;
  spawnDrop(gx, gy); sfx.splash(); vibrate(30);
 } else if(sbTool==='plant'){
  if(!t.des){ t.P=Math.min(100, t.P+40); t.scaleAnim=1.4; popAt(gx, gy); sfx.pop(); vibrate(30); }
 } else if(sbTool==='herb'){
  herbs.push(mk(gx, gy, 70)); popAt(gx, gy); sfx.chirpH(); vibrate(30);
 } else if(sbTool==='carn'){
  carns.push(mk(gx, gy, 70)); popAt(gx, gy); sfx.chirpC(); vibrate(30);
 } else if(sbTool==='storm'){
  vapor=100; sfx.thunder(); vibrate(100);
 } else if(hasChem && sbTool==='lime' && limeCharges>0){
  limeCharges--;
  sfx.fizz();
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
   const nx=gx+dx, ny=gy+dy;
   if(nx>=0&&nx<N&&ny>=0&&ny<N){
    const nt=tiles[ny*N+nx];
    nt.caoh2Mol=(nt.caoh2Mol||0)+CHEM.CAOH2_MOL_PER_TOOL/9;
    const neutral=Math.min(nt.acidMol||0,2*nt.caoh2Mol);nt.acidMol=Math.max(0,(nt.acidMol||0)-neutral);nt.caoh2Mol=Math.max(0,nt.caoh2Mol-neutral/2);
    nt.bufferMol=Math.max(0,(nt.bufferMol||0)-Math.min(nt.bufferMol||0,neutral));
    nt.W = Math.min(100, nt.W + neutral*18/1000);updateChemPH(nt);
   }
  }
  unlockFormula(7); // CaO + H2O -> Ca(OH)2
  vibrate(40);
 } else if(hasChem && sbTool==='elec' && elecCharges>0 && elecCool<=0 && t.W > 20){
  elecCharges--; elecCool = 8;
  const waterAvailable=(t.waterMol||t.W*CHEM.WATER_MOL_PER_MM);const h2Produced=Math.min(waterAvailable,0.02);t.waterMol=waterAvailable-h2Produced;t.W=Math.max(0,t.W-h2Produced*18/1000);t.h2Mol=(t.h2Mol||0)+h2Produced;t.o2Mol=(t.o2Mol||0)+h2Produced/2;h2=Math.min(100,h2+h2Produced*1000);o2=Math.min(100,o2+h2Produced*500);
  sfx.bubble();
  unlockFormula(5); // 2H2O -> 2H2 + O2
  const [sx, sy] = proj(gx, gy);
  for(let k=0; k<5; k++) addP({k:'bubble', x:sx+(Math.random()-.5)*20, y:sy, vx:(Math.random()-.5)*20, vy:-(20+Math.random()*30), l:0, m:1, s:2});
  vibrate(50);
 } else if(hasChem && sbTool==='volcano'){
  t.limestone = false;
  t.so2Mol=(t.so2Mol||0)+0.001;
  co2 = Math.min(2000, co2 + 20);
  sfx.sizzle(); vibrate(60);
 } else if(hasChem && sbTool==='limestone'){
  t.limestone = true;t.caco3Mol=(t.caco3Mol||0)+CHEM.CACO3_MOL_PER_STOCK;
  sfx.pop(); vibrate(30);
 }
 terrainDirty=true;
}

function exportCanvasImage(){

 tempCv.width=cv.width; tempCv.height=cv.height;

 hs=hotspot(tN);

 const Rh=(hs.r+.6)*tw*.707;
 tCtx.save();

 const gr=tCtx.createRadialGradient(0,0,0,0,0,Rh);
 gr.addColorStop(0,'rgba(255,240,180,0.35)');gr.addColorStop(.5,'rgba(255,180,80,0.17)');gr.addColorStop(1,'rgba(255,120,40,0)');
 tCtx.fillStyle=gr;tCtx.beginPath();tCtx.arc(0,0,Rh,0,TAU);tCtx.fill();

 }
 for(const a of herbs)objs.push({d:a.fx+a.fy+.01,k:1,a:a,sc:a.scaleAnim||1});
 for(const a of carns)objs.push({d:a.fx+a.fy+.02,k:2,a:a,sc:a.scaleAnim||1});
 objs.sort((p,q)=>p.d-q.d);

 const oldCtx = ctx;
 try{

  for(const o of objs){
   if(o.k===0){const p=proj(o.x,o.y);drawPlant(p[0],p[1],o.P,o.wv,o.sc,o.x,o.y);}
   else{const p=proj(o.a.fx,o.a.fy);if(o.k===1)drawHerb(p[0],p[1],o.a,o.sc);else drawCarn(p[0],p[1],o.a,o.sc);}
  }
 }finally{ctx=oldCtx;tCtx.restore();}

 tCtx.font='700 '+(16*S*DPR)+'px system-ui, sans-serif';
 tCtx.fillStyle='rgba(255,255,255,0.75)';
 tCtx.textAlign='right';
 tCtx.fillText('Hệ Sinh Thái Hành Tinh Xanh', tempCv.width - 20*DPR, tempCv.height - 20*DPR);

 tempCv.toBlob(blob => {
  if(!blob) return;
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download='hanh-tinh-xanh-regret.png';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 1000);
 }, 'image/png');
}

function updParts(dt){
 for(let i=0;i<parts.length;i++){
  const p=parts[i];
  p.l+=dt;
  if(p.k==='drop'){p.y+=p.vy*dt;if(p.y>=p.ty){p.l=p.m;addP({k:'splash',x:p.x,y:p.ty,l:0,m:.5});}}
  else{p.x+=(p.vx||0)*dt;p.y+=(p.vy||0)*dt;if(p.k==='ember')p.vy+=20*dt;}

 parts=parts.filter(p=>p.l<p.m);

// ---------- Drawing Helpers & Palette ----------
function rr(c,x,y,w,h,r){
 r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);
 c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();
}
function txt(s,x,y,size,col,al,wt){
 const text=String(s).normalize('NFC'),align=al||'center',weight=(String(wt)==='400'||String(wt)==='500'||wt==='regular')?'500':'700';
 ctx.fillStyle=col||UI.color.text;ctx.textAlign=align;ctx.textBaseline='middle';
 let fs=Math.max(12,size*(settings&&Number.isFinite(settings.uiScale)?settings.uiScale:1)*(settings&&settings.largeText?1.12:1));
 const maxWidth=Math.max(24,align==='center'?W-32*S:align==='left'?W-x-16*S:x-16*S);
 ctx.font=weight+' '+fs+'px '+UI.font;
 while(fs>12&&ctx.measureText(text).width>maxWidth){fs=Math.max(12,fs-2);ctx.font=weight+' '+fs+'px '+UI.font;}
 if(ctx.measureText(text).width>maxWidth){let t=text;while(t.length>2&&ctx.measureText(t+'…').width>maxWidth)t=t.slice(0,-1);ctx.fillText(t+(t!==text?'…':''),x,y);}else ctx.fillText(text,x,y);
}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,Math.max(0.1,r),0,TAU);c.fill();}
function ell(c,x,y,rx,ry){c.beginPath();c.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),0,0,TAU);c.fill();}
function lerpC(a,b,t){t=clamp(t,0,1);return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function rgb(c,k){k=clamp(k,0,1);return 'rgb('+((c[0]*k)|0)+','+((c[1]*k)|0)+','+((c[2]*k)|0)+')';}

const C_DRY=[185,142,95], C_WET=[72,118,88], C_DES=[210,185,125], C_ICE=[190,230,250];

// ---------- Sprite Pre-rendering ----------
function buildTileSprites(){
 const tw=lay.tw, th=lay.th, hw=tw/2, hh=th/2;
 const dep=tw*0.35;
 const types=['dry','wet','des','ice'];
 types.forEach(type=>{
  const sCv=document.createElement('canvas');
  sCv.width=Math.ceil((tw+4)*DPR); sCv.height=Math.ceil((th+dep+6)*DPR);
  const sCtx=sCv.getContext('2d'); sCtx.scale(DPR, DPR);
  
  let c=C_DRY;
  if(type==='wet') c=C_WET;
  if(type==='des') c=C_DES;
  if(type==='ice') c=C_ICE;

  const cx=hw+2, cy=hh+2;

  sCtx.fillStyle=rgb(c,.42);
  sCtx.beginPath();sCtx.moveTo(cx-hw,cy);sCtx.lineTo(cx,cy+hh);sCtx.lineTo(cx,cy+hh+dep);sCtx.lineTo(cx-hw,cy+dep);sCtx.closePath();sCtx.fill();

  sCtx.fillStyle=rgb(c,.58);
  sCtx.beginPath();sCtx.moveTo(cx+hw,cy);sCtx.lineTo(cx,cy+hh);sCtx.lineTo(cx,cy+hh+dep);sCtx.lineTo(cx+hw,cy+dep);sCtx.closePath();sCtx.fill();

  sCtx.fillStyle=rgb(c,1);
  sCtx.beginPath();sCtx.moveTo(cx,cy-hh);sCtx.lineTo(cx+hw,cy);sCtx.lineTo(cx,cy+hh);sCtx.lineTo(cx-hw,cy);sCtx.closePath();sCtx.fill();

  sCtx.strokeStyle='rgba(255,255,255,0.25)'; sCtx.lineWidth=1; sCtx.stroke();

  if(type==='des'){
   sCtx.strokeStyle='rgba(90,70,50,0.35)'; sCtx.lineWidth=1;
   sCtx.beginPath(); sCtx.moveTo(cx-hw*0.3, cy-hh*0.2); sCtx.lineTo(cx, cy); sCtx.lineTo(cx+hw*0.2, cy+hh*0.4); sCtx.stroke();
  }

  tileSprites[type]=sCv;
 });
}

// ---------- Lifeforms & Terrain ----------
function drawPlant(cx,cy,P,wv,sc=1,x=0,y=0){
 P*=(1-wv);if(P<3)return;
 const tw=lay.tw,k=P/100;
 const sway=Math.sin(tAll*2.5 + x*1.3 + y*0.8)*tw*0.04*k;
 ctx.save(); ctx.translate(cx, cy); ctx.scale(sc, sc);

 ctx.fillStyle='rgba(10,20,30,0.35)';
 ell(ctx, 0, tw*0.05, tw*(0.15+0.2*k), tw*(0.08+0.1*k));

 if(P<25){
  ctx.fillStyle='#80c060'; circ(ctx, sway*0.5, -tw*0.08, tw*(0.05+0.06*P/25));
  ctx.restore(); return;
 } else if(P<60){
  const hg=tw*(0.3+0.3*k), w=tw*(0.15+0.15*k);
  ctx.fillStyle='#5c4028'; ctx.fillRect(-w*0.15, -hg*0.4, w*0.3, hg*0.4);
  ctx.fillStyle='#4aa255'; circ(ctx, sway*0.6, -hg*0.5, w*0.7);
  ctx.fillStyle='#7cd880'; circ(ctx, sway*0.8, -hg*0.7, w*0.5);
  ctx.restore(); return;
 }

 const hg=tw*(0.35+0.45*k), w=tw*(0.18+0.2*k);
 ctx.fillStyle='#5c4028';
 ctx.beginPath();ctx.moveTo(-w*0.2,0);ctx.lineTo(w*0.2,0);ctx.lineTo(sway*0.5,-hg*0.55);ctx.lineTo(-w*0.2+sway*0.5,-hg*0.55);ctx.closePath();ctx.fill();

 const c1=rgb([35,110,55],1), c2=rgb([65,155,75],1), c3=rgb([100,190,95],1);
 ctx.fillStyle=c1; circ(ctx, sway*0.6, -hg*0.55, w*0.85);
 ctx.fillStyle=c2; circ(ctx, sway*0.8 - w*0.25, -hg*0.75, w*0.65); circ(ctx, sway*0.8 + w*0.25, -hg*0.75, w*0.65);
 ctx.fillStyle=c3; circ(ctx, sway - w*0.1, -hg*0.95, w*0.5);

 if(P>85){
  ctx.fillStyle='#ff5d73'; circ(ctx, sway - w*0.3, -hg*0.8, tw*0.04);
  circ(ctx, sway + w*0.2, -hg*0.65, tw*0.04);
  ctx.fillStyle='#ffe260'; circ(ctx, sway + w*0.1, -hg*0.9, tw*0.035);
 }

 ctx.restore();
}

function drawHerb(cx,cy,a,sc=1){
 const s=lay.tw*.22;
 const hop=Math.abs(Math.sin(tAll*6 + a.x*1.7 + a.y))*s*0.2;
 ctx.save(); ctx.translate(cx, cy - hop); ctx.scale(sc, sc);
 ctx.globalAlpha=clamp(a.a,0,1);

 ctx.fillStyle='rgba(10,20,30,0.25)'; ell(ctx,0,hop,s*0.85,s*0.38);

 ctx.fillStyle='#dcefff'; ctx.strokeStyle='#9bc2de'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.ellipse(0, -s*0.7, s*0.8, s*0.65, 0, 0, TAU); ctx.fill(); ctx.stroke();
 ctx.fillStyle='#ffffff'; ell(ctx, 0, -s*0.55, s*0.5, s*0.35);

 const earWiggle=Math.sin(tAll*10 + a.x)*0.08;
 ctx.fillStyle='#dcefff';
 ctx.beginPath(); ctx.ellipse(-s*0.4, -s*1.35, s*0.2, s*0.45, -0.2+earWiggle, 0, TAU); ctx.fill(); ctx.stroke();
 ctx.beginPath(); ctx.ellipse(s*0.4, -s*1.35, s*0.2, s*0.45, 0.2+earWiggle, 0, TAU); ctx.fill(); ctx.stroke();

 a.blinkT = (a.blinkT || 0) + 0.02;
 const blink = Math.sin(a.blinkT) > 0.96 ? 0.1 : 1;
 const lookX = (a.eyeDir ? a.eyeDir.x : 0) * s * 0.05;
 const lookY = (a.eyeDir ? a.eyeDir.y : 0) * s * 0.05;

 ctx.fillStyle='#1e3245';
 ell(ctx, -s*0.3 + lookX, -s*0.75 + lookY, s*0.12, s*0.14*blink);
 ell(ctx, s*0.3 + lookX, -s*0.75 + lookY, s*0.12, s*0.14*blink);

 ctx.globalAlpha=1; ctx.restore();
}

function drawCarn(cx,cy,a,sc=1){
 const s=lay.tw*.24;
 const hop=Math.abs(Math.sin(tAll*7 + a.x*1.2 + a.y*1.5))*s*0.25;

function renderTerrainToBuffer(){
 bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height);
 bgCtx.save(); bgCtx.scale(DPR, DPR);

 const tw=lay.tw,th=lay.th,hw=tw/2,hh=th/2;
 const depBase=tw*0.35;
 const floatY=Math.sin(tAll*1.8)*3;

 const centerP=proj(3.5, 3.5);
 const islandWidth=N*tw, islandHeight=N*th;
 bgCtx.fillStyle='rgba(5,10,15,0.45)';
 ell(bgCtx, centerP[0], centerP[1]+islandHeight*0.4, islandWidth*0.5, islandHeight*0.25);

 bgCtx.fillStyle='#2d2018';
 bgCtx.beginPath();
 bgCtx.moveTo(lay.ox - 4*hw, lay.oy + 4*hh + floatY);
 bgCtx.lineTo(lay.ox, lay.oy + 8*hh + floatY);
 bgCtx.lineTo(lay.ox + 4*hw, lay.oy + 4*hh + floatY);
 bgCtx.lineTo(lay.ox, lay.oy + 8*hh + floatY + tw*2.2);
 bgCtx.closePath(); bgCtx.fill();

 for(let s=0;s<=14;s++)for(let x=0;x<N;x++){
  const y=s-x;if(y<0||y>=N)continue;
  const t=tiles[y*N+x]||{T:30,W:50,P:0,pH:7,limestone:false,des:false,hot:0,wv:0,frozen:false};

  let wv=0;
  if(collapsed&&!t.des)wv=clamp((cT-Math.hypot(x-cOrig.x,y-cOrig.y)*.07)/.4,0,1);

  const elev = t.des ? -th*0.15 : (t.W > 40 ? th*0.1 : 0);
  const p=proj(x,y), cx=p[0], cy=p[1] + elev;

  let spriteKey='dry';
  if(t.des) spriteKey='des';
  else if(t.frozen) spriteKey='ice';
  else if(t.W > 40) spriteKey='wet';

  const sp=tileSprites[spriteKey];
  if(sp){
   bgCtx.drawImage(sp, (cx - hw - 2), (cy - hh - 2), (tw + 4), (th + depBase + 6));
  }

  // pH Tint overlay
  const L=LEVELS[lvl]||LEVELS[0];
  if((isSandbox || L.chem) && !t.des){
   if(t.pH < 5.5){
    bgCtx.fillStyle='rgba(180,255,80,0.25)';
    bgCtx.beginPath();bgCtx.moveTo(cx,cy-hh);bgCtx.lineTo(cx+hw,cy);bgCtx.lineTo(cx,cy+hh);bgCtx.lineTo(cx-hw,cy);bgCtx.closePath();bgCtx.fill();
   } else if(t.pH > 8.5){
    bgCtx.fillStyle='rgba(120,120,255,0.25)';
    bgCtx.beginPath();bgCtx.moveTo(cx,cy-hh);bgCtx.lineTo(cx+hw,cy);bgCtx.lineTo(cx,cy+hh);bgCtx.lineTo(cx-hw,cy);bgCtx.closePath();bgCtx.fill();
   }
  }

  if(t.limestone){
   bgCtx.fillStyle='#ffffff';
   circ(bgCtx, cx, cy, tw*0.15);
  }

  if(!t.des && t.W > 40){
   const sheen = Math.sin(tAll*3 + x + y)*0.15 + 0.15;
   bgCtx.fillStyle='rgba(120,200,255,'+sheen+')';
   bgCtx.beginPath();bgCtx.moveTo(cx,cy-hh);bgCtx.lineTo(cx+hw,cy);bgCtx.lineTo(cx,cy+hh);bgCtx.lineTo(cx-hw,cy);bgCtx.closePath();bgCtx.fill();
  }

  if(t.T > 65){
   const heatGlow = Math.min(0.5, (t.T - 65)/50);
   bgCtx.fillStyle='rgba(255,80,30,'+(heatGlow*(0.6+0.4*Math.sin(tAll*8)))+')';
   bgCtx.beginPath();bgCtx.moveTo(cx,cy-hh);bgCtx.lineTo(cx+hw,cy);bgCtx.lineTo(cx,cy+hh);bgCtx.lineTo(cx-hw,cy);bgCtx.closePath();bgCtx.fill();
  }
 }
 bgCtx.restore();
 terrainDirty=false;
}

  renderTerrainToBuffer();
  lastTerrainDraw = now;
 }

 const tw=lay.tw;

 ctx.fillStyle=beamGrad;
 ctx.beginPath(); ctx.moveTo(lensX-15*S, lensY); ctx.lineTo(lensX+15*S, lensY); ctx.lineTo(hx+tw*1.8, hy); ctx.lineTo(hx-tw*1.8, hy); ctx.closePath(); ctx.fill();

 ctx.translate(hx,hy);ctx.scale(1,.5);
 const gr=ctx.createRadialGradient(0,0,0,0,0,Rh);
 const a0=.35+.35*(hs.peak/1.5);
 gr.addColorStop(0,'rgba(255,240,180,'+a0+')');gr.addColorStop(.5,'rgba(255,180,80,'+(a0*.5)+')');gr.addColorStop(1,'rgba(255,120,40,0)');
 ctx.fillStyle=gr;ctx.beginPath();ctx.arc(0,0,Rh,0,TAU);ctx.fill();
 ctx.restore();

 if(flareWarn || flareActive){
  for(let dy=-1;dy<=1;dy++){
   for(let dx=-1;dx<=1;dx++){
    const fx=flarePos.x+dx, fy=flarePos.y+dy;
    if(fx>=0&&fx<N&&fy>=0&&fy<N){
     const [pX,pY]=proj(fx,fy);
     ctx.fillStyle=flareActive?'rgba(255,80,0,0.42)':'rgba(255,200,0,'+(0.25+0.15*Math.sin(tAll*10))+')';

    }
   }
  }
 }

 const objs=[];
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  const t=tiles[y*N+x];if(t&&!t.des&&t.P>=8)objs.push({d:x+y,k:0,x:x,y:y,P:t.P,wv:t.wv,sc:t.scaleAnim||1});
 }
 for(const a of herbs)objs.push({d:a.fx+a.fy+.01,k:1,a:a,sc:a.scaleAnim||1});

 objs.sort((p,q)=>p.d-q.d);

  if(o.k===0){const p=proj(o.x,o.y);drawPlant(p[0],p[1],o.P,o.wv,o.sc,o.x,o.y);}
  else{const p=proj(o.a.fx,o.a.fy);if(o.k===1)drawHerb(p[0],p[1],o.a,o.sc);else drawCarn(p[0],p[1],o.a,o.sc);}

 for(const p of parts){
  const u=p.l/p.m;
  if(p.k==='drop'){
   ctx.strokeStyle='rgba(160,215,255,0.75)';ctx.lineWidth=1.5;
   ctx.beginPath();ctx.moveTo(p.x,p.y-10);ctx.lineTo(p.x-3,p.y);ctx.stroke();
  }else if(p.k==='splash'){
   const rx=lay.tw*.25*u+3;

   ctx.beginPath();ctx.ellipse(p.x,p.y,rx,rx*.5,0,0,TAU);ctx.stroke();
  }else if(p.k==='steam'){

  }else if(p.k==='spark'){
   ctx.fillStyle='rgba(160,255,180,'+(1-u)+')';circ(ctx,p.x,p.y,p.s*(1-u*.5));
  }else if(p.k==='ember'){
   ctx.fillStyle='rgba(255,140,40,'+(1-u)+')';circ(ctx,p.x,p.y,p.s*(1-u*.4));
  }else if(p.k==='firefly'){
   ctx.fillStyle='rgba(180,255,120,'+(Math.sin(u*Math.PI)*0.8)+')';circ(ctx,p.x,p.y,p.s);
  }else if(p.k==='bubble'){
   ctx.fillStyle='rgba(200,240,255,'+(1-u)+')';circ(ctx,p.x,p.y,p.s*(1+u));
  }
 }
}

function drawReplayWorld(){
 if(ringSize === 0) return;
 const targetIdx = (ringHead - ringSize + replayIdx + REPLAY_MAX) % REPLAY_MAX;
 const snap = ringSnapshots[targetIdx];

 const liveTerrain=tiles.map(t=>({T:t.T,W:t.W,P:t.P,pH:t.pH,des:t.des,frozen:t.frozen}));
 const terrainDirtyBefore=terrainDirty;
 try{
  for(let i=0;i<tiles.length;i++){
   const t=tiles[i];t.T=snap.tilesT[i];t.W=snap.tilesW[i];t.P=snap.tilesP[i];t.pH=snap.tilespH[i];t.des=!!snap.tilesDes[i];t.frozen=!!snap.tilesFrozen[i];

  objs.push({d:snap.herbsX[i]+snap.herbsY[i]+.01, k:1, x:snap.herbsX[i], y:snap.herbsY[i]});

  objs.push({d:snap.carnsX[i]+snap.carnsY[i]+.02, k:2, x:snap.carnsX[i], y:snap.carnsY[i]});

 objs.sort((p,q)=>p.d-q.d);

 for(const o of objs){
  if(o.k===0){const p=proj(o.x,o.y);drawPlant(p[0],p[1],o.P,0,1,o.x,o.y);}
  else if(o.k===1){const p=proj(o.x,o.y);drawHerb(p[0],p[1],{x:o.x,y:o.y,a:1},1);}
  else{const p=proj(o.x,o.y);drawCarn(p[0],p[1],{x:o.x,y:o.y,a:1},1);}
 }

 drawCloud(snap.vapor);
 txt('▶ XEM LẠI SỤP ĐỔ (0.35x)', W/2, 50*S, 16*S, '#ffe28a', 'center', '800');
}

function drawLevelSelect(){
 const cx=W/2;
 txt('CHỌN MÀN CHƠI & THẺ SINH THÁI',cx,H*0.10,18*S,'#bfffd0','center','800');

 const cols=3, rows=4;
 const bw=Math.min(105*S, W*0.28), bh=38*S;
 const gapX=12*S, gapY=8*S;
 const startX=cx - (cols*bw + (cols-1)*gapX)/2 + bw/2;
 const startY=H*0.15 + bh/2;

 for(let i=0;i<12;i++){
  const r=(i/cols)|0, c=i%cols;
  const x=startX + c*(bw+gapX);
  const y=startY + r*(bh+gapY);
  const isUnlocked = i <= unlockedLvl;

  if(isUnlocked){
   button((i+1)+'. '+LEVELS[i].name, x, y, bw, bh, ()=>{
    if(i >= 9){
     startMinigame(()=>startLevel(i));
    } else {
     startLevel(i);
    }
   }, '#6fd68a');
   const st = levelStars[i] || 0;
   let stStr = '';
   for(let k=0;k<3;k++) stStr += (k < st ? '★' : '☆');
   if(regretCardsUnlocked.includes(i)) stStr += ' 📜';
   txt(stStr, x, y + bh*0.32, 10*S, '#ffe28a', 'center', '700');
  } else {
   button((i+1)+'. Khóa', x, y, bw, bh, ()=>{}, '#556677');
  }
 }

 button('Phòng Lab (Minigame)', cx - 80*S, H*0.88, 150*S, 34*S, ()=>{
  startMinigame(()=>{});
 }, '#7fe3a0');

 button('Xóa tiến trình', cx + 80*S, H*0.88, 130*S, 34*S, ()=>{
  if(confirm('Bạn có chắc muốn xóa lại từ đầu?')){
   unlockedLvl=0; levelStars=new Array(12).fill(0); tutorialStep=0; regretCardsUnlocked=[]; codexUnlocked=[];
   saveStore('p_unlocked',0); saveStore('p_stars',levelStars); saveStore('p_tut',0); saveStore('p_regret',[]); saveStore('p_codex',[]);
  }
 }, '#ff8a8a');
}

  button('Chọn màn',cx+65*S,H*.68,120*S,46*S,()=>state='select','#ffd36b');
  button('Lưu ảnh kỷ niệm',cx,H*.77,160*S,36*S,exportCanvasImage,'#7fe3a0');
 }else if(state==='lose'){
  txt('Ôi không...',cx,cy-10*S,28*S,'#ffb08a','center','800');
  txt(loseMsg,cx,cy+28*S,14*S,'rgba(255,255,255,.9)','center','500');

  if(ringSize > 5){
   button('Xem lại chậm',cx-70*S,H*.60,130*S,46*S,()=>{
    isReplaying=true; replayIdx=0; replayTimer=0;
   },'#ffb25a');
   button('Thử lại',cx+70*S,H*.60,120*S,46*S,()=>startLevel(lvl),'#ffd36b');
  } else {
   button('Thử lại',cx-65*S,H*.60,120*S,46*S,()=>startLevel(lvl),'#ffd36b');
  }

  storyChain().slice(-3).forEach((v,i)=>txt(v,cx,H*.40+i*17*S,Math.min(10*S,W*.028),'#d7e6e9','center','500'));
  button('Chia sẻ',cx-70*S,H*.70,120*S,38*S,shareStory,'#337f94');button('Lưu ảnh câu chuyện',cx+70*S,H*.70,145*S,38*S,exportStoryCard,'#7fe3a0');
  button('Chọn màn',cx,H*.78,130*S,34*S,()=>state='select','#8ef0a0');
 }
 ctx.globalAlpha=1;
}

// ---------- Input Handling ----------
let drag=null;
function ptr(e){const r=cv.getBoundingClientRect();return [(e.clientX-r.left)*(W/r.width),(e.clientY-r.top)*(H/r.height)];}
function setSlider(i,x){const x0=35*S,x1=W-35*S;const v=clamp((x-x0)/(x1-x0),0,1);if(i===0){s1=v; unlockFormula(1);}else s2=v;}

cv.addEventListener('pointerdown',e=>{
 e.preventDefault();
 initAudio();
 const p=ptr(e),x=p[0],y=p[1];

 if(settingsOpen||tutorialActive||codexOpen||minigameData){for(const b of btns){if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.fn();return;}}if(settingsOpen){return;}if(tutorialActive){return;}if(codexOpen)codexOpen=false;return;}

 for(const b of btns){if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){b.fn();return;}}
 if(Math.hypot(x-(W-30*S),y-(H-25*S))<30*S){
  muted=!muted; saveStore('p_muted', muted);
  if(master&&AC)master.gain.setTargetAtTime(muted?0:.5,AC.currentTime,.02);return;
 }
 if(state==='play'){
  for(let i=0;i<2;i++){
   if(Math.abs(y-sliderY(i))<28*S&&x>=15*S&&x<=W-15*S){
    drag={i:i,id:e.pointerId};
    try{cv.setPointerCapture(e.pointerId);}catch(_){}
    setSlider(i,x);return;
   }
  }
  const gridPos = unproj(x, y);
  handleTileClick(gridPos[0], gridPos[1]);
 }
},{passive:false});
cv.addEventListener('pointermove',e=>{if(drag&&e.pointerId===drag.id){e.preventDefault();setSlider(drag.i,ptr(e)[0]);}},{passive:false});
const endDrag=e=>{
 if(drag&&e.pointerId===drag.id){
  try{cv.releasePointerCapture(e.pointerId);}catch(_){}
  drag=null;
 }
};
cv.addEventListener('pointerup',endDrag);cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.tabIndex=0;cv.setAttribute('role','application');cv.setAttribute('aria-label','Hệ Sinh Thái Hành Tinh Xanh. Dùng Tab để chuyển vùng tương tác, Enter hoặc Space để kích hoạt.');let keyboardButton=0;cv.addEventListener('keydown',e=>{if(e.key&&e.key.toLowerCase()==='o'&&state==='play'){cycleOverlay();return;}if(e.key==='Tab'){if(btns.length){keyboardButton=(keyboardButton+(e.shiftKey?-1:1)+btns.length)%btns.length;e.preventDefault();}return;}if((e.key==='Enter'||e.key===' ')&&btns.length){e.preventDefault();const b=btns[keyboardButton%btns.length];if(b&&typeof b.fn==='function')b.fn();}});


// ---------- Main Game Loop ----------
let last=0;
function frame(ts){
 try{
  const dt=Math.min(.1,(ts-last)/1000||0);last=ts;
  tAll+=dt;stateT+=dt;

  frameTimeHistory.push(dt);
  if(frameTimeHistory.length > 30){
   frameTimeHistory.shift();
   const avgDt = frameTimeHistory.reduce((a,b)=>a+b,0)/30;
   if(avgDt > 0.024) lowQualityMode=true;
  }

  if(isReplaying){
   replayTimer += dt;
   if(replayTimer >= 0.28){
    replayTimer = 0; replayIdx++;
    if(replayIdx >= ringSize){ isReplaying=false; }
   }
  }

  photoT=Math.max(0,photoT-dt);photoCool=Math.max(0,photoCool-dt);rainT=Math.max(0,rainT-dt);
  flash=Math.max(0,flash-dt/.9);shakeT=Math.max(0,shakeT-dt);
  if(state==='play' && !isReplaying && !codexOpen && !minigameData){
   hintT+=dt;acc+=dt * (isSandbox ? simSpeed : 1);let n=0;
   while(acc>=TICK&&state==='play'&&n++<6){acc-=TICK;tick();}
   if(state!=='play')acc=0;
   if(rainT>0&&Math.random()<dt*25){const j=(Math.random()*64)|0;spawnDrop(j%N,(j/N)|0);}
  }else if(state==='collapse'){
   cT+=dt;
   for(let i=embQ.length-1;i>=0;i--){
    if(embQ[i].t<=cT){
     const q=embQ.splice(i,1)[0],p=proj(q.x,q.y);
     addP({k:'ember',x:p[0],y:p[1],vx:(Math.random()-.5)*40,vy:-(50+Math.random()*110),l:0,m:1+Math.random()*8,s:2+Math.random()*3});
    }
   }
   if(Math.random()<dt*40)steam(Math.random()*7,Math.random()*7,true);
   for(const a of herbs)a.a=Math.max(0,1-cT/1.2);
   for(const a of carns)a.a=Math.max(0,1-cT/1.2);
   if(cT>=1.5){
    if(isSandbox){
     startLevel(0, true);
     loseMsg=pick(SANDBOX_RESET_MSG);
    } else {
     state='lose';stateT=0;loseMsg=pick(LOSE_COL);
    }
   }
  }
  const k=Math.min(1,dt*7);
  for(const a of herbs){a.fx+=(a.x-a.fx)*k;a.fy+=(a.y-a.fy)*k;}
  for(const a of carns){a.fx+=(a.x-a.fx)*k;a.fy+=(a.y-a.fy)*k;}
  updParts(dt);

  ctx.setTransform(DPR,0,0,DPR,0,0);
  btns.length=0;

  const bg=ctx.createLinearGradient(0,0,0,H);
  if(!isSandbox && LEVELS[lvl] && LEVELS[lvl].dn && state==='play'){
   const dnK=dayNightFactor;
   bg.addColorStop(0, rgb([10*dnK, 15*dnK, 28*dnK], 1));
   bg.addColorStop(.55, rgb([18*dnK, 28*dnK, 45*dnK], 1));
   bg.addColorStop(1, rgb([8*dnK, 12*dnK, 20*dnK], 1));
  } else {
   bg.addColorStop(0,'#060b11');bg.addColorStop(.55,'#122232');bg.addColorStop(1,'#081018');
  }
  ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);

  ctx.fillStyle='rgba(255,255,255,0.25)';
  for(let i=0;i<25;i++){
   const sx=((i*137)%W), sy=((i*219)%H);
   const twinkle=Math.sin(tAll*3 + i)*0.5 + 0.5;
   ctx.fillStyle='rgba(255,255,255,'+(0.1 + 0.3*twinkle)+')';
   ctx.fillRect(sx, sy, 1.5*S, 1.5*S);
  }

  const px=W*0.82, py=H*0.18;
  ctx.fillStyle='rgba(200,230,255,0.12)'; circ(ctx, px, py, 30*S);
  ctx.strokeStyle='rgba(200,230,255,0.08)'; ctx.lineWidth=2;
  ell(ctx, px, py, 45*S, 10*S);

  ctx.save();
  if(!settings.reduced&&shakeT>0){const m=10*S*(shakeT/.6);ctx.translate((Math.random()-.5)*m,(Math.random()-.5)*m);}
  drawWorld();
  ctx.restore();

  if(!settings.reduced&&flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*.65)+')';ctx.fillRect(0,0,W,H);}
  drawOverlayLayer();drawHUD();drawControls();drawOverlay();

  if(codexOpen) drawCodex();
  if(minigameData) drawMinigame();
  if(settingsOpen)drawSettings();
  if(tutorialActive)drawTutorial();
  if(settings.showFps){fpsFrames++;if(ts-fpsStamp>=500){fpsValue=Math.round(fpsFrames*1000/(ts-fpsStamp||1));fpsFrames=0;fpsStamp=ts;}ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(8*S,8*S,54*S,20*S);txt(fpsValue+' FPS',35*S,22*S,10*S,'#fff','center','700');}

 }catch(err){
  console.error("Game loop frame recovery:", err);
 }
 requestAnimationFrame(frame);
}

window.addEventListener('resize',resize);
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installPromptEvent=e;triggerToast('Có bản cài đặt - mở Cài đặt để cài game');});
window.addEventListener('appinstalled',()=>{installPromptEvent=null;triggerToast('Đã cài Hành Tinh Xanh!');});
if(location.protocol==='https:'||location.hostname==='localhost'){try{if('serviceWorker' in navigator)navigator.serviceWorker.register('./sw.js').then(reg=>{if(reg.waiting)triggerToast('Có bản cập nhật - tải lại');reg.addEventListener('updatefound',()=>{const w=reg.installing;if(w)w.addEventListener('statechange',()=>{if(w.state==='installed'&&navigator.serviceWorker.controller)triggerToast('Có bản cập nhật - tải lại');});});}).catch(()=>{});}catch(_){}}
resize();
state='menu';stateT=0;
requestAnimationFrame(frame);
})();
</script>
