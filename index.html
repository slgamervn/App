<!DOCTYPE html>

<title>Hệ Sinh Thái Hành Tinh Xanh - Stage 2</title>
<!-- Chosen Palette: Deep Cosmic Teal, Solar Gold, Emerald Green & Terracotta -->
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#14202b;overscroll-behavior:none;user-select:none;-webkit-user-select:none}
canvas{display:block;width:100vw;height:100vh;touch-action:none;-webkit-tap-highlight-color:transparent}

<body>
<canvas id="c"></canvas>
<script>
(()=>{
'use strict';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const N=8,TICK=0.25,DUR=45,TT=180,TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const pick=a=>a[(Math.random()*a.length)|0];

const LEVELS=[
 {name:'Khởi động',w:50,g:{p:10,h:2,c:0},drift:false,hint:['Kéo "Góc chiếu" để rải nắng, đừng đứng yên!','Đứng một chỗ quá lâu là đất khô cháy đó.']},
 {name:'Chuỗi thức ăn',w:40,g:{p:12,h:3,c:1},drift:false,hint:['Cây nuôi ăn cỏ, ăn cỏ nuôi ăn thịt.','Tiêu cự cao + ít nắng toàn cục = mưa.']},
 {name:'Mặt trời trôi',w:30,g:{p:14,h:4,c:2},drift:true,hint:['Mặt trời đang trôi, hãy chỉnh liên tục!','Hơi nước quá nhiều sẽ làm cả hành tinh nóng lên.']},
 {name:'Bão mặt trời',w:40,g:{p:12,h:3,c:1},drift:false,flare:true,hint:['Chú ý vùng cảnh báo bão mặt trời! Né hoặc làm mờ tiêu cự.']},
 {name:'Đêm băng giá',w:50,g:{p:12,h:3,c:1},drift:false,dn:true,hint:['Đêm xuống nhiệt độ giảm sâu. Gom nắng vào một chỗ để chống đóng băng!']},
 {name:'Đại tuần hoàn',w:30,g:{p:14,h:4,c:2},drift:true,flare:true,dn:true,hint:['Thử thách tổng hợp: Mặt trời trôi, bão flare và chu kỳ ngày đêm!']}
];
const WIN_MSG=[
 'Cây mọc, cỏ nhai, bình yên ghê.',
 'Chuỗi thức ăn chạy mượt như phim tài liệu.',
 'Bạn đuổi theo mặt trời giỏi thật đấy!',
 'Bão mặt trời không làm khó được bạn!',
 'Xử lý đêm băng giá cực kỳ ấm áp.',
 'Bạn đã chinh phục Đại tuần hoàn hoàn hảo!'
];
const LOSE_COL=['Hành tinh vừa thành bánh tráng nướng!','Bạn nướng chín cả hệ sinh thái rồi!','Sa mạc hóa nhanh hơn cả deadline!'];
const LOSE_TIME=['Hết giờ mà hệ sinh thái chưa đạt cân bằng!','Thiên nhiên cần thêm nắng khéo hơn chút.'];

// ---------- State ----------
let W=0,H=0,DPR=1,S=1;
let state='menu',stateT=0,lvl=0,loseMsg='',unlockedLvl=0,levelStars=[0,0,0,0,0,0];
let s1=0.5,s2=0.05;
let tiles=[],herbs=[],carns=[],parts=[],embQ=[],btns=[];
let ticks=0,acc=0,vapor=0,o2=0,rainT=0,photoT=0,photoCool=0,flash=0,shakeT=0,cT=0,tAll=0,hintT=0;
let collapsed=false,cOrig={x:3.5,y:3.5},muted=false;
let hs={x:3.5,y:3,r:2.5,peak:.8};

// Mechanics State
let flareTimer=0,flareActive=false,flareWarn=false,flarePos={x:3,y:3};
let vaporOver100Timer=0,stormActive=false,stormTimer=0,stormStrikeTimer=0;
let dayNightFactor=1;

const lay={tw:40,th:20,ox:0,oy:0,cx:0,cy:0,hudH:134,top:134,bot:400};

function resize(){
 DPR=Math.min(window.devicePixelRatio||1,2.5);
 W=window.innerWidth;H=window.innerHeight;
 cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
 S=Math.max(.75,Math.min(1.3,Math.min(W,H)/390));
 const top=110*S,bot=H*0.72;
 const tw=Math.max(18,Math.min((W-24)/8,(bot-top-40)/4));
 lay.tw=tw;lay.th=tw/2;lay.top=top;lay.bot=bot;lay.hudH=top;
 lay.cx=W/2;lay.cy=top+(bot-top)/2+10;
 lay.ox=lay.cx;lay.oy=lay.cy-3.5*lay.th;
}
function proj(x,y){return [lay.ox+(x-y)*lay.tw/2,lay.oy+(x+y)*lay.th/2];}

// ---------- Audio Synthesis Engine ----------
let AC=null,master=null,ambientGain=null,noiseBuf=null;const lastS={};
function initAudio(){
 if(AC){if(AC.state==='suspended')AC.resume();return;}
 try{
  AC=new (window.AudioContext||window.webkitAudioContext)();
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=6;
  master=AC.createGain();master.gain.value=muted?0:.5;
  master.connect(comp);comp.connect(AC.destination);

  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;

  startAmbient();
 }catch(e){AC=null;}
}

function startAmbient(){
 if(!AC)return;
 ambientGain=AC.createGain();
 ambientGain.gain.value=0.08;
 ambientGain.connect(master);

 const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
 const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=180;
 s.connect(fl);fl.connect(ambientGain);s.start();

 const o1=AC.createOscillator(), o2=AC.createOscillator();
 o1.type='sine';o1.frequency.value=110;
 o2.type='triangle';o2.frequency.value=164.81;
 const gPad=AC.createGain();gPad.gain.value=0.15;
 o1.connect(gPad);o2.connect(gPad);gPad.connect(ambientGain);
 o1.start();o2.start();
}

function gate(n,gap){const t=performance.now()/1000;if(lastS[n]&&t-lastS[n]<gap)return false;lastS[n]=t;return true;}
function tone(f0,f1,dur,vol,delay,type){
 if(!AC||muted)return;delay=delay||0;
 const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
 o.type=type||'sine';o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
 g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);
}
function noise(dur,type,f0,f1,vol,delay,q){
 if(!AC||muted)return;delay=delay||0;
 const t=AC.currentTime+delay,s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
 const fl=AC.createBiquadFilter();fl.type=type;fl.Q.value=q||.7;
 fl.frequency.setValueAtTime(f0,t);fl.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
 const g=AC.createGain();g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.03);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
 s.connect(fl);fl.connect(g);g.connect(master);s.start(t);s.stop(t+dur+.05);
}
const sfx={
 pop(){if(gate('pop',.08))tone(620,180,.14,.14);},
 splash(){if(gate('splash',.15))noise(.22,'bandpass',1800,600,.12,0,.8);},
 sizzle(){if(gate('sizzle',.3))noise(.35,'highpass',6000,6000,.035);},
 chirpH(){if(gate('chirp',.18)){tone(740,780,.07,.1);tone(990,1000,.09,.1,.08);}},
 chirpC(){if(gate('chirp',.18)){tone(330,300,.08,.1);tone(247,230,.1,.1,.09);}},
 boom(){tone(95,28,1.3,.5);noise(1.3,'lowpass',2400,150,.28);},
 win(){tone(523,523,.25,.14);tone(659,659,.25,.14,.15);tone(784,784,.5,.14,.3);},
 thunder(){
  tone(120,30,0.8,0.4);
  noise(0.9,'lowpass',1200,80,0.35,0,2);
 },
 crackle(){
  noise(0.12,'highpass',8000,2000,0.25);
  tone(1200,400,0.08,0.2,'sawtooth');
 }
};

// ---------- Ecosystem Simulation ----------
function hotspot(t){
 const f=s2,r=3-1.8*f,peak=.6+.9*f;
 let x=s1*7;
 if(LEVELS[lvl].drift){const u=(t*0.4)%12;x+=u<3?u:(u<9?6-u:u-12);}
 x=clamp(x,-1,8);
 const k=clamp(x/7,0,1);
 return {x:x,y:5.8-2.6*Math.sin(Math.PI*k),r:r,peak:peak};
}
function lightAt(h,x,y){
 const dx=x-h.x,dy=y-h.y,s=.75*h.r;
 let l = .15+h.peak*Math.exp(-(dx*dx+dy*dy)/(2*s*s));
 if(LEVELS[lvl].dn){
  l *= dayNightFactor;
 }
 if(flareActive && Math.abs(x-flarePos.x)<=1 && Math.abs(y-flarePos.y)<=1){
  l += 1.8;
 }
 return l;
}

function startLevel(i){
 lvl=i;const L=LEVELS[i];
 tiles=[];for(let k=0;k<64;k++)tiles.push({T:30.5,W:L.w,P:0,des:false,hot:0,wv:0,frozen:false});
 herbs=[];carns=[];parts=[];embQ=[];
 ticks=0;acc=0;vapor=0;o2=0;rainT=0;photoT=0;photoCool=0;flash=0;shakeT=0;cT=0;hintT=0;collapsed=false;
 flareTimer=0;flareActive=false;flareWarn=false;
 vaporOver100Timer=0;stormActive=false;stormTimer=0;stormStrikeTimer=0;dayNightFactor=1;
 state='play';stateT=0;
}
function counts(){let p=0;for(const t of tiles)if(!t.des&&t.P>=25)p++;return {p:p,h:herbs.length,c:carns.length};}
function plantList(){const a=[];for(let i=0;i<64;i++){const t=tiles[i];if(!t.des&&t.P>=25)a.push({x:i%N,y:(i/N)|0});}return a;}
function nearest(a,list){let b=null,bd=1e9;for(const o of list){const d=Math.abs(o.x-a.x)+Math.abs(o.y-a.y);if(d<bd){bd=d;b=o;}}return b;}
function stepToward(a,tx,ty){
 const dx=tx-a.x,dy=ty-a.y;if(!dx&&!dy)return;
 const ax=Math.abs(dx),ay=Math.abs(dy);
 if(ax>ay||(ax===ay&&Math.random()<.5))a.x+=Math.sign(dx);else a.y+=Math.sign(dy);
}
function wander(a){
 const d=pick([[1,0],[-1,0],[0,1],[0,-1]]);const x=a.x+d[0],y=a.y+d[1];
 if(x>=0&&x<N&&y>=0&&y<N){a.x=x;a.y=y;}
}
function mk(x,y,e){return {x:x,y:y,fx:x,fy:y,e:e,age:0,a:1,dead:false};}

function triggerLightning(){
 const cx=(Math.random()*N)|0, cy=(Math.random()*N)|0;
 flash=0.6; shakeT=0.3;
 sfx.crackle(); sfx.thunder();
 for(let dy=-1;dy<=1;dy++){
  for(let dx=-1;dx<=1;dx++){
   const nx=cx+dx, ny=cy+dy;
   if(nx>=0&&nx<N&&ny>=0&&ny<N){
    const idx=ny*N+nx;
    tiles[idx].P=0;
    const [sx,sy]=proj(nx,ny);
    for(let k=0;k<3;k++)addP({k:'ember',x:sx,y:sy,vx:(Math.random()-.5)*60,vy:-(40+Math.random()*60),l:0,m:0.6,s:3});
   }
  }
 }
}

function tick(){
 const h=hotspot(ticks*TICK);
 const L=LEVELS[lvl];

 if(L.dn){
  const cycle= (ticks*TICK) % 20;
  dayNightFactor = 0.4 + 0.6 * (Math.sin((cycle/20)*TAU - Math.PI/2) * 0.5 + 0.5);
 }else{
  dayNightFactor = 1;
 }

 if(L.flare){
  flareTimer += TICK;
  if(!flareActive && !flareWarn && flareTimer>=7){
   flareWarn=true;
   flarePos={x:1+((Math.random()*(N-2))|0), y:1+((Math.random()*(N-2))|0)};
  }
  if(flareWarn && flareTimer>=8){
   flareWarn=false;
   flareActive=true;
  }
  if(flareActive && flareTimer>=11){
   flareActive=false;
   flareTimer=0;
  }
 }

 const lt=new Array(64);let sum=0;
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){const l=lightAt(h,x,y);lt[y*N+x]=l;sum+=l;}
 const avg=sum/64;

 const gh=vapor>60?(vapor-60)*1.1:0;
 const evap=[],popList=[],newDes=[];let grew=0;
 for(let i=0;i<64;i++){
  const t=tiles[i],l=lt[i];
  t.T+=(20+70*l+gh-t.T)*.1;
  if(t.des){t.P=0;t.W=0;t.frozen=false;continue;}

  if(t.T < 15){
   t.frozen=true;
  } else if(t.T > 25){
   if(t.frozen){ t.W=Math.min(100, t.W+15); }
   t.frozen=false;
  }

  if(t.frozen){
   t.P=Math.max(0, t.P-2);
   continue;
  }

  if(t.T>70&&t.W>0){t.W=Math.max(0,t.W-2.5);vapor=Math.min(100,vapor+1.5);evap.push(i);}
  if(l>.3&&t.W>20&&t.T>=30&&t.T<=65){
   const pv=t.P;t.P=Math.min(100,t.P+3);o2+=.03;t.W-=.5;grew++;
   if(pv<25&&t.P>=25)popList.push(i);
  }
  if(t.W<5||t.T>75)t.P=Math.max(0,t.P-4);
  if(t.T>85)t.hot++;else t.hot=0;
  if(t.hot>=16||(t.W<=0&&t.T>70)){t.des=true;t.P=0;t.W=0;newDes.push(i);}
 }

 for(let i=0;i<64;i++){
  const t=tiles[i];
  if(!t.des&&!t.frozen&&t.P>70&&Math.random()<.03){
   const x=i%N,y=(i/N)|0,nb=[];
   for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){
    const X=x+d[0],Y=y+d[1];
    if(X>=0&&X<N&&Y>=0&&Y<N){const n=tiles[Y*N+X];if(!n.des&&!n.frozen&&n.P<5&&n.W>20)nb.push(n);}
   }
   if(nb.length){pick(nb).P=12;}
  }
 }

 if(vapor>30&&avg<.35){
  vapor=Math.max(0,vapor-3);
  for(let k=0;k<3;k++){
   const j=(Math.random()*64)|0;
   if(!tiles[j].des&&!tiles[j].frozen)tiles[j].W=Math.min(100,tiles[j].W+8);
   spawnDrop(j%N,(j/N)|0);
  }
  rainT=.6;sfx.splash();
 }

 if(vapor>=100){
  vaporOver100Timer += TICK;
  if(vaporOver100Timer >= 3 && !stormActive){
   stormActive=true;
   stormTimer=0;
   stormStrikeTimer=0;
  }
 } else {
  vaporOver100Timer=0;
 }

 if(stormActive){
  stormTimer += TICK;
  stormStrikeTimer += TICK;
  if(stormStrikeTimer >= 0.8){
   stormStrikeTimer=0;
   triggerLightning();
  }
  if(stormTimer >= 6){
   stormActive=false;
   stormTimer=0;
  }
 }

 if(evap.length){
  sfx.sizzle();
  for(let k=0;k<Math.min(5,evap.length);k++){const i=pick(evap);steam(i%N,(i/N)|0,false);}
 }
 for(const i of popList){
  const [sx,sy]=proj(i%N,(i/N)|0);
  for(let k=0;k<4;k++)addP({k:'spark',x:sx,y:sy-lay.tw*.2,vx:(Math.random()-.5)*40,vy:-(30+Math.random()*40),l:0,m:.6,s:2.5});
 }
 if(popList.length)sfx.pop();
 for(const i of newDes){
  const [sx,sy]=proj(i%N,(i/N)|0);
  for(let k=0;k<4;k++)addP({k:'ember',x:sx,y:sy,vx:(Math.random()-.5)*50,vy:-(30+Math.random()*60),l:0,m:.9,s:2+Math.random()*2});
  steam(i%N,(i/N)|0,false);
 }
 if(grew&&photoCool<=0){photoT=2;photoCool=6;}

 const pl=plantList();
 if(pl.length>=8&&herbs.length===0){const c=pick(pl);herbs.push(mk(c.x,c.y,60));sfx.chirpH();popAt(c.x,c.y);}
 if(herbs.length>=4&&carns.length===0){
  const free=[];for(let i=0;i<64;i++)if(!tiles[i].des)free.push(i);
  if(free.length){const i=pick(free);carns.push(mk(i%N,(i/N)|0,60));sfx.chirpC();popAt(i%N,(i/N)|0);}
 }

 const bornH=[];
 for(const a of herbs){
  a.e-=1.2;a.age++;
  if(a.e<=0){a.dead=true;continue;}
  if(a.age%2===0){
   if(a.e<90){
    const tg=nearest(a,plantList());
    if(tg)stepToward(a,tg.x,tg.y);else wander(a);
    const t=tiles[a.y*N+a.x];
    if(!t.des&&!t.frozen&&t.P>=15){t.P=Math.max(0,t.P-15);a.e=Math.min(100,a.e+20);}
   }else if(Math.random()<.4)wander(a);
  }
  if(a.e>85&&herbs.length+bornH.length<6){
   a.e-=35;const c=mk(a.x,a.y,50);bornH.push(c);sfx.chirpH();popAt(a.x,a.y);
  }
 }
 for(const b of bornH)herbs.push(b);

 const bornC=[];
 for(const a of carns){
  a.e-=1.2;a.age++;
  if(a.e<=0){a.dead=true;continue;}
  if(a.age%2===0){
   const tg=nearest(a,herbs.filter(o=>!o.dead));
   if(tg&&a.e<90){
    stepToward(a,tg.x,tg.y);
    if(a.x===tg.x&&a.y===tg.y){tg.dead=true;a.e=Math.min(100,a.e+40);sfx.chirpC();}
   }else if(!tg||Math.random()<.4)wander(a);
  }
  if(a.e>85&&carns.length+bornC.length<3){
   a.e-=35;bornC.push(mk(a.x,a.y,50));sfx.chirpC();popAt(a.x,a.y);
  }
 }
 for(const b of bornC)carns.push(b);
 herbs=herbs.filter(a=>!a.dead);carns=carns.filter(a=>!a.dead);

 let dc=0;for(const t of tiles)if(t.des)dc++;
 if(dc>25.6){triggerCollapse(h);return;}
 ticks++;
 if(ticks>=TT)finish();
}

function finish(){
 const c=counts(),g=LEVELS[lvl].g;
 stateT=0;
 if(c.p>=g.p&&c.h>=g.h&&c.c>=g.c){
  state='win';sfx.win();
  let stars = 1;
  if(c.p>=g.p+2 && c.h>=g.h+2 && c.c>=g.c+2) stars = 2;
  let hasDesert = false;
  for(const t of tiles) if(t.des) hasDesert = true;
  if(stars===2 && !hasDesert) stars = 3;

  levelStars[lvl] = Math.max(levelStars[lvl], stars);
  if(lvl < 5) unlockedLvl = Math.max(unlockedLvl, lvl+1);
 }
 else{state='lose';loseMsg=pick(LOSE_TIME);}
}

function triggerCollapse(h){
 state='collapse';cT=0;shakeT=.6;flash=1;collapsed=true;cOrig={x:h.x,y:h.y};sfx.boom();
 for(let i=0;i<60;i++)steam(Math.random()*7,Math.random()*7,true);
 for(let i=0;i<64;i++){
  const x=i%N,y=(i/N)|0,d=Math.hypot(x-h.x,y-h.y);
  for(let k=0;k<2;k++)embQ.push({t:d*.07+Math.random()*.2,x:x+Math.random()-.5,y:y+Math.random()-.5});
 }
}

// ---------- Particles ----------
function addP(p){if(parts.length<600)parts.push(p);}
function steam(x,y,big){
 const [sx,sy]=proj(x,y);
 addP({k:'steam',x:sx+(Math.random()-.5)*lay.tw*.4,y:sy-4,vx:(Math.random()-.5)*14,vy:-(25+Math.random()*30)*(big?1.8:1),l:0,m:big?1.4:1+Math.random()*.6,s:lay.tw*(big?.28:.14)});
}
function spawnDrop(x,y){
 const [sx,sy]=proj(x,y);
 addP({k:'drop',x:sx+(Math.random()-.5)*lay.tw*.3,y:sy-lay.tw*3,ty:sy,vy:420,l:0,m:5});
}
function popAt(x,y){
 const [sx,sy]=proj(x,y);
 for(let k=0;k<5;k++)addP({k:'spark',x:sx,y:sy-lay.tw*.2,vx:(Math.random()-.5)*60,vy:-(20+Math.random()*50),l:0,m:.5,s:2.5});
}
function updParts(dt){
 for(const p of parts){
  p.l+=dt;
  if(p.k==='drop'){p.y+=p.vy*dt;if(p.y>=p.ty){p.l=p.m;addP({k:'splash',x:p.x,y:p.ty,l:0,m:.5});}}
  else{p.x+=(p.vx||0)*dt;p.y+=(p.vy||0)*dt;if(p.k==='ember')p.vy+=20*dt;}
 }
 parts=parts.filter(p=>p.l<p.m);
}

// ---------- Drawing Helpers ----------
function rr(x,y,w,h,r){
 r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);
 ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}

 ctx.fillStyle=col;ctx.textAlign=al||'left';ctx.fillText(s,x,y);
}
function circ(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();}
function ell(x,y,rx,ry){ctx.beginPath();ctx.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),0,0,TAU);ctx.fill();}
function lerpC(a,b,t){return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function rgb(c,k){return 'rgb('+((c[0]*k)|0)+','+((c[1]*k)|0)+','+((c[2]*k)|0)+')';}
const C_DRY=[198,160,108],C_WET=[80,54,36],C_DES=[240,226,160];

function drawPlant(cx,cy,P,wv){
 P*=(1-wv);if(P<3)return;
 const tw=lay.tw,k=P/100;
 if(P<25){ctx.fillStyle='#86c765';circ(cx,cy-tw*.06,tw*.05+tw*.05*P/25);return;}
 const hg=tw*(.22+.5*k),w=tw*(.12+.14*k);
 ctx.fillStyle='rgba(0,0,0,.18)';ell(cx,cy,w*1.2,w*.55);
 ctx.fillStyle='hsl('+(105+k*20)+','+(45+k*20)+'%,'+(36+(1-k)*14)+'%)';
 ctx.beginPath();ctx.moveTo(cx-w,cy);ctx.lineTo(cx+w,cy);ctx.lineTo(cx,cy-hg);ctx.closePath();ctx.fill();
 if(P>55){
  ctx.fillStyle='hsl(120,55%,46%)';circ(cx,cy-hg*.8,w*1.05);
  ctx.fillStyle='rgba(255,255,255,.2)';circ(cx-w*.3,cy-hg*.8-w*.3,w*.35);
 }
}

 ctx.fillStyle='#e6f4ff';ctx.strokeStyle='#8fbfe6';ctx.lineWidth=1.5;
 ctx.beginPath();ctx.ellipse(cx,cy-s*.85-b,s,s*.85,0,0,TAU);ctx.fill();ctx.stroke();
 ctx.fillStyle='#27405c';circ(cx-s*.35,cy-s*1.0-b,s*.13);circ(cx+s*.35,cy-s*1.0-b,s*.13);

}
function drawCarn(cx,cy,a){

 ctx.globalAlpha=a.a;
 ctx.fillStyle='rgba(0,0,0,.2)';ell(cx,cy,s*.9,s*.4);
 ctx.fillStyle='#f28a2e';ctx.strokeStyle='#b8530f';ctx.lineWidth=1.5;
 ctx.beginPath();ctx.moveTo(cx-s,by);ctx.lineTo(cx,by-s*.8);ctx.lineTo(cx+s,by);ctx.lineTo(cx,by+s*.7);ctx.closePath();ctx.fill();ctx.stroke();
 ctx.beginPath();ctx.moveTo(cx-s*.8,by-s*.3);ctx.lineTo(cx-s*.95,by-s*1.1);ctx.lineTo(cx-s*.2,by-s*.6);ctx.closePath();ctx.fill();
 ctx.beginPath();ctx.moveTo(cx+s*.8,by-s*.3);ctx.lineTo(cx+s*.95,by-s*1.1);ctx.lineTo(cx+s*.2,by-s*.6);ctx.closePath();ctx.fill();
 ctx.fillStyle='#3a1a05';circ(cx-s*.3,by-s*.1,s*.11);circ(cx+s*.3,by-s*.1,s*.11);

function drawCloud(){
 if(vapor<1)return;
 const tw=lay.tw,k=.25+vapor/100*1.1,R=tw*1.0*k;

}

function drawWorld(){
 const tw=lay.tw,th=lay.th,hw=tw/2,hh=th/2,dep=tw*.12;
 const tN=state==='play'?ticks*TICK+acc:ticks*TICK;
 hs=hotspot(tN);
 const g0=ctx.createRadialGradient(lay.cx,lay.cy,10,lay.cx,lay.cy,tw*7);
 g0.addColorStop(0,'rgba(120,200,170,.16)');g0.addColorStop(1,'rgba(120,200,170,0)');
 ctx.fillStyle=g0;ctx.fillRect(0,0,W,lay.bot+40);

 if(flareWarn || flareActive){
  for(let dy=-1;dy<=1;dy++){
   for(let dx=-1;dx<=1;dx++){
    const fx=flarePos.x+dx, fy=flarePos.y+dy;
    if(fx>=0&&fx<N&&fy>=0&&fy<N){
     const [pX,pY]=proj(fx,fy);
     ctx.fillStyle=flareActive?'rgba(255,100,0,0.4)':'rgba(255,200,0,'+(0.25+0.15*Math.sin(tAll*10))+')';
     ctx.beginPath();ctx.moveTo(pX,pY-hh);ctx.lineTo(pX+hw,pY);ctx.lineTo(pX,pY+hh);ctx.lineTo(pX-hw,pY);ctx.closePath();ctx.fill();
    }
   }
  }
 }

 for(let s=0;s<=14;s++)for(let x=0;x<N;x++){
  const y=s-x;if(y<0||y>=N)continue;
  const t=tiles[y*N+x]||{T:30,W:50,P:0,des:false,hot:0,wv:0,frozen:false};
  let wv=0;
  if(collapsed&&!t.des)wv=clamp((cT-Math.hypot(x-cOrig.x,y-cOrig.y)*.07)/.4,0,1);
  t.wv=wv;
  const p=proj(x,y),cx=p[0],cy=p[1];
  let c=t.des?C_DES:lerpC(C_DRY,C_WET,clamp(t.W/70,0,1));
  if(wv>0&&!t.des)c=lerpC(c,C_DES,wv);
  let heat=clamp((t.T-45)/55,0,1)*.5*(1-wv*.6);
  if(wv>0&&wv<1)heat+=.35;
  const wat=t.des?0:clamp((t.W-40)/60,0,1)*.28*(1-wv);
  ctx.fillStyle=rgb(c,.62);
  ctx.beginPath();ctx.moveTo(cx-hw,cy);ctx.lineTo(cx,cy+hh);ctx.lineTo(cx,cy+hh+dep);ctx.lineTo(cx-hw,cy+dep);ctx.closePath();ctx.fill();
  ctx.fillStyle=rgb(c,.45);
  ctx.beginPath();ctx.moveTo(cx+hw,cy);ctx.lineTo(cx,cy+hh);ctx.lineTo(cx,cy+hh+dep);ctx.lineTo(cx+hw,cy+dep);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(cx,cy-hh);ctx.lineTo(cx+hw,cy);ctx.lineTo(cx,cy+hh);ctx.lineTo(cx-hw,cy);ctx.closePath();
  ctx.fillStyle=rgb(c,1);ctx.fill();
  if(heat>.01){ctx.fillStyle='rgba(255,60,30,'+Math.min(.7,heat)+')';ctx.fill();}
  if(wat>.01){ctx.fillStyle='rgba(60,140,255,'+wat+')';ctx.fill();}

  if(t.frozen){
   ctx.fillStyle='rgba(180,230,255,0.45)';
   ctx.fill();
  }

  ctx.strokeStyle='rgba(0,0,0,.14)';ctx.lineWidth=1;ctx.stroke();
 }

 const hp=proj(hs.x,hs.y),hx=hp[0],hy=hp[1];
 const Rh=(hs.r+.6)*tw*.707,ly=hy-tw*3.4,lr=tw*.55;
 const bg=ctx.createLinearGradient(0,ly,0,hy);
 bg.addColorStop(0,'rgba(255,240,170,.20)');bg.addColorStop(1,'rgba(255,240,170,.03)');
 ctx.fillStyle=bg;
 ctx.beginPath();ctx.moveTo(hx-lr,ly);ctx.lineTo(hx+lr,ly);ctx.lineTo(hx+Rh*.5,hy);ctx.lineTo(hx-Rh*.5,hy);ctx.closePath();ctx.fill();
 ctx.save();
 ctx.globalCompositeOperation='lighter';
 ctx.translate(hx,hy);ctx.scale(1,.5);
 const gr=ctx.createRadialGradient(0,0,0,0,0,Rh);
 const a0=.3+.3*(hs.peak/1.5);
 gr.addColorStop(0,'rgba(255,240,170,'+a0+')');gr.addColorStop(.5,'rgba(255,200,90,'+(a0*.45)+')');gr.addColorStop(1,'rgba(255,170,60,0)');
 ctx.fillStyle=gr;ctx.beginPath();ctx.arc(0,0,Rh,0,TAU);ctx.fill();
 ctx.restore();
 ctx.strokeStyle='rgba(255,240,170,.3)';ctx.lineWidth=1.5;
 ctx.beginPath();ctx.ellipse(hx,hy,hs.r*.707*tw,hs.r*.354*tw,0,0,TAU);ctx.stroke();

 const objs=[];
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){const t=tiles[y*N+x];if(t&&!t.des&&t.P>=8)objs.push({d:x+y,k:0,x:x,y:y,P:t.P,wv:t.wv});}
 for(const a of herbs)objs.push({d:a.fx+a.fy+.01,k:1,a:a});
 for(const a of carns)objs.push({d:a.fx+a.fy+.02,k:2,a:a});
 objs.sort((p,q)=>p.d-q.d);
 for(const o of objs){
  if(o.k===0){const p=proj(o.x,o.y);drawPlant(p[0],p[1],o.P,o.wv);}
  else{const p=proj(o.a.fx,o.a.fy);if(o.k===1)drawHerb(p[0],p[1],o.a);else drawCarn(p[0],p[1],o.a);}
 }

 ctx.fillStyle='rgba(200,235,255,.35)';ctx.strokeStyle='#bfe9ff';ctx.lineWidth=2;
 ctx.beginPath();ctx.ellipse(hx,ly,lr,lr*.4,0,0,TAU);ctx.fill();ctx.stroke();

 drawCloud();

 for(const p of parts){
  const u=p.l/p.m;
  if(p.k==='drop'){
   ctx.strokeStyle='rgba(150,200,255,.8)';ctx.lineWidth=2;
   ctx.beginPath();ctx.moveTo(p.x,p.y-12);ctx.lineTo(p.x,p.y);ctx.stroke();
  }else if(p.k==='splash'){
   const rx=lay.tw*.25*u+3;
   ctx.strokeStyle='rgba(170,215,255,'+(1-u)+')';ctx.lineWidth=1.5;
   ctx.beginPath();ctx.ellipse(p.x,p.y,rx,rx*.5,0,0,TAU);ctx.stroke();
  }else if(p.k==='steam'){
   ctx.fillStyle='rgba(255,255,255,'+(.35*(1-u))+')';circ(p.x,p.y,p.s*(1+u));
  }else if(p.k==='spark'){
   ctx.fillStyle='rgba(150,255,150,'+(1-u)+')';circ(p.x,p.y,p.s*(1-u*.5));
  }else if(p.k==='ember'){
   ctx.globalCompositeOperation='lighter';
   ctx.fillStyle='rgba(255,140,40,'+(1-u)+')';circ(p.x,p.y,p.s*(1-u*.4));
   ctx.globalCompositeOperation='source-over';
  }
 }

 if(photoT>0){
  const a=Math.min(1,photoT/.5,(2-photoT)/.3+.0001);
  txt('CO2 + H2O -> C6H12O6 + O2',lay.cx,lay.top+8*S,13*S,'rgba(190,255,200,'+clamp(a,0,1)+')','center','600');
 }
}

// ---------- Main Game Loop ----------
let last=0;
function frame(ts){
 const dt=Math.min(.1,(ts-last)/1000||0);last=ts;
 tAll+=dt;stateT+=dt;
 photoT=Math.max(0,photoT-dt);photoCool=Math.max(0,photoCool-dt);rainT=Math.max(0,rainT-dt);
 flash=Math.max(0,flash-dt/.9);shakeT=Math.max(0,shakeT-dt);
 if(state==='play'){
  hintT+=dt;acc+=dt;let n=0;
  while(acc>=TICK&&state==='play'&&n++<6){acc-=TICK;tick();}
  if(state!=='play')acc=0;
  if(rainT>0&&Math.random()<dt*25){const j=(Math.random()*64)|0;spawnDrop(j%N,(j/N)|0);}
 }else if(state==='collapse'){
