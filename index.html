let AC=null,master=null,ambientGain=null,noiseBuf=null,activeSoundCount=0;
const lastS={};
function initAudio(){
 if(AC){if(AC.state==='suspended')try{AC.resume();}catch(e){}return;}
 try{
  AC=new (window.AudioContext||window.webkitAudioContext)();
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-18;comp.ratio.value=6;
  master=AC.createGain();master.gain.value=muted?0:.5;
  master.connect(comp);comp.connect(AC.destination);

  noiseBuf=AC.createBuffer(1,Math.min(AC.sampleRate*2, 96000),AC.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;

  startAmbient();
 }catch(e){AC=null;}
}

function startAmbient(){
 if(!AC||!master)return;
 try{
  ambientGain=AC.createGain();
  ambientGain.gain.value=0.08;
  ambientGain.connect(master);

  const s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;
  const fl=AC.createBiquadFilter();fl.type='lowpass';fl.frequency.value=180;
  s.connect(fl);fl.connect(ambientGain);s.start();

  const o1=AC.createOscillator(), o2=AC.createOscillator();
  o1.type='sine';o1.frequency.value=110;
  o2.type='triangle';o2.frequency.value=164.81;
  const gPad=AC.createGain();gPad.gain.value=0.15;
  o1.connect(gPad);o2.connect(gPad);gPad.connect(ambientGain);
  o1.start();o2.start();
 }catch(e){}
}

function gate(n,gap){const t=performance.now()/1000;if(lastS[n]&&t-lastS[n]<gap)return false;lastS[n]=t;return true;}
function tone(f0,f1,dur,vol,delay,type){
 if(!AC||muted||activeSoundCount>12)return;delay=delay||0;
 try{
  activeSoundCount++;
  const t=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();
  o.type=type||'sine';o.frequency.setValueAtTime(clamp(f0,10,20000),t);
  o.frequency.exponentialRampToValueAtTime(Math.max(1,f1),t+dur);
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.05);
  o.onended=()=>{activeSoundCount=Math.max(0,activeSoundCount-1);};
 }catch(e){activeSoundCount=Math.max(0,activeSoundCount-1);}
}
function noise(dur,type,f0,f1,vol,delay,q){
 if(!AC||muted||!noiseBuf||activeSoundCount>12)return;delay=delay||0;
 try{
  activeSoundCount++;
  const t=AC.currentTime+delay,s=AC.createBufferSource();s.buffer=noiseBuf;s.loop=true;

// ---------- Ecosystem & Chemistry Simulation ----------
function hotspot(t){
 const f=clamp(s2,0,1),r=4.8-3.3*f,peak=.6+.9*f;
 let x=s1*7;
 if(!isSandbox && LEVELS[lvl] && LEVELS[lvl].drift){const u=(t*0.4)%12;x+=u<3?u:(u<9?6-u:u-12);}
 x=clamp(x,-1,8);
 const k=clamp(x/7,0,1);
 return {x:x,y:5.8-2.6*Math.sin(Math.PI*k),r:r,peak:peak};
}
function lightAt(h,x,y){
 const dx=x-h.x,dy=y-h.y,s=.75*h.r;
 let l = .15+h.peak*Math.exp(-(dx*dx+dy*dy)/(2*s*s));
 if(!isSandbox && LEVELS[lvl] && LEVELS[lvl].dn){l *= dayNightFactor;}
 if(flareActive && Math.abs(x-flarePos.x)<=1 && Math.abs(y-flarePos.y)<=1){l += 1.8;}
 return clamp(l,0,10);
}

function startLevel(i, sandbox=false){
 isSandbox=sandbox;lvl=clamp(i,0,11);if(roomCode&&roomData&&roomData.status==='playing'&&raceSeed!==null)seedRandom(raceSeed);else{raceSeed=null;seedRandom((Math.random()*4294967296)>>>0);onlineScorePayload=null;onlineScoreSent=false;onlineScoreRetry=false;}const L=LEVELS[lvl]||LEVELS[0];
 tiles=[];
 for(let k=0;k<64;k++){
  let isLime = false;
  if(!sandbox && L.limestone && (k===27 || k===36 || k===28)) isLime = true;
  tiles.push({T:30.5,W:sandbox?60:L.w,P:0,pH:7.0,limestone:isLime,des:false,hot:0,wv:0,frozen:false,scaleAnim:1});
 }
 herbs=[];carns=[];parts=[];embQ=[];ringSize=0;ringHead=0;isReplaying=false;
 ticks=0;acc=0;vapor=0;o2=0;co2=50;h2=0;rainT=0;photoT=0;photoCool=0;flash=0;shakeT=0;cT=0;hintT=0;collapsed=false;
 flareTimer=0;flareActive=false;flareWarn=false;
 vaporOver100Timer=0;stormActive=false;stormTimer=0;stormStrikeTimer=0;dayNightFactor=1;
 volcanoTimer=0; volcanoActive=false;
 limeCharges = sandbox ? 99 : 3;
 elecCharges = sandbox ? 99 : 3;
 elecCool = 0;
 terrainDirty=true;
 state='play';stateT=0;
}

function counts(){let p=0;for(const t of tiles)if(!t.des&&t.P>=25)p++;return {p:p,h:herbs.length,c:carns.length};}
function plantList(){const a=[];for(let i=0;i<64;i++){const t=tiles[i];if(t&&!t.des&&t.P>=25)a.push({x:i%N,y:(i/N)|0});}return a;}
function nearest(a,list){let b=null,bd=1e9;for(const o of list){const d=Math.abs(o.x-a.x)+Math.abs(o.y-a.y);if(d<bd){bd=d;b=o;}}return b;}
function stepToward(a,tx,ty){
 const dx=tx-a.x,dy=ty-a.y;if(!dx&&!dy)return;
 const ax=Math.abs(dx),ay=Math.abs(dy);
 if(ax>ay||(ax===ay&&rand()<.5))a.x+=Math.sign(dx);else a.y+=Math.sign(dy);
 a.x=clamp(a.x,0,N-1); a.y=clamp(a.y,0,N-1);
}
function wander(a){
 const d=pick([[1,0],[-1,0],[0,1],[0,-1]]);const x=a.x+d[0],y=a.y+d[1];
 if(x>=0&&x<N&&y>=0&&y<N){a.x=x;a.y=y;}
}
function mk(x,y,e){return {x:clamp(x,0,7),y:clamp(y,0,7),fx:x,fy:y,e:clamp(e,0,100),age:0,a:1,dead:false,scaleAnim:1.4,blinkT:0,eyeDir:{x:0,y:0}};}

function triggerLightning(){
 const cx=(rand()*N)|0, cy=(rand()*N)|0;
 flash=0.6; shakeT=0.3;vibrate(120);
 sfx.crackle(); sfx.thunder();
 for(let dy=-1;dy<=1;dy++){
  for(let dx=-1;dx<=1;dx++){
   const nx=cx+dx, ny=cy+dy;
   if(nx>=0&&nx<N&&ny>=0&&ny<N){
    const idx=ny*N+nx;
    tiles[idx].P=0;
    const [sx,sy]=proj(nx,ny);
    for(let k=0;k<3;k++)addP({k:'ember',x:sx,y:sy,vx:(Math.random()-.5)*60,vy:-(40+Math.random()*60),l:0,m:0.6,s:3});
   }
  }
 }
 terrainDirty=true;
}

function triggerHydrogenExplosion(){
 flash=1.0; shakeT=0.8; vibrate(400); sfx.boom();
 for(let i=0;i<64;i++){
  const t=tiles[i];
  t.P=0; t.W=Math.max(0, t.W-25);
  const [sx,sy]=proj(i%N,(i/N)|0);
  for(let k=0;k<4;k++) addP({k:'ember',x:sx,y:sy,vx:(Math.random()-.5)*80,vy:-(60+Math.random()*100),l:0,m:0.8,s:3.5});
 }
 h2=0; vapor=Math.min(100, vapor+30);
 unlockFormula(9); // 2H2 + O2 -> 2H2O
 terrainDirty=true;
}

function saveSnapshot(){
 const snap = ringSnapshots[ringHead];
 for(let i=0; i<64; i++){
  snap.tilesT[i] = tiles[i].T;
  snap.tilesW[i] = tiles[i].W;
  snap.tilesP[i] = tiles[i].P;
  snap.tilespH[i] = tiles[i].pH;
  snap.tilesDes[i] = tiles[i].des ? 1 : 0;
  snap.tilesFrozen[i] = tiles[i].frozen ? 1 : 0;
 }
 snap.herbsCount = Math.min(16, herbs.length);
 for(let i=0; i<snap.herbsCount; i++){
  snap.herbsX[i] = herbs[i].x;
  snap.herbsY[i] = herbs[i].y;
 }
 snap.carnsCount = Math.min(8, carns.length);
 for(let i=0; i<snap.carnsCount; i++){
  snap.carnsX[i] = carns[i].x;
  snap.carnsY[i] = carns[i].y;
 }
 snap.vapor = vapor;

 ringHead = (ringHead + 1) % REPLAY_MAX;
 if(ringSize < REPLAY_MAX) ringSize++;
}

function tick(){
 const h=hotspot(ticks*TICK);
 const L=LEVELS[lvl]||LEVELS[0];
 const hasChem = isSandbox || L.chem;

 if(!isSandbox && L.dn){
  const cycle= (ticks*TICK) % 20;
  dayNightFactor = 0.4 + 0.6 * (Math.sin((cycle/20)*TAU - Math.PI/2) * 0.5 + 0.5);
 }else{
  dayNightFactor = 1;
 }

 if(elecCool>0) elecCool-=TICK;

 if(hasChem){
  volcanoTimer += TICK;
  if(L.volcano && !volcanoActive && volcanoTimer >= 10){
   volcanoActive = true;
   volcanoTimer = 0;
  } else if(volcanoActive && volcanoTimer >= 3){
   volcanoActive = false;
   volcanoTimer = 0;
  }
 }

 if(!isSandbox && L.flare){
  flareTimer += TICK;
  if(!flareActive && !flareWarn && flareTimer>=7){
   flareWarn=true;
   flarePos={x:1+((rand()*(N-2))|0), y:1+((rand()*(N-2))|0)};
  }
  if(flareWarn && flareTimer>=8){
   flareWarn=false;
   flareActive=true;
  }
  if(flareActive && flareTimer>=11){
   flareActive=false;
   flareTimer=0;
  }
 }

 const lt=new Array(64);let sum=0;
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){const l=lightAt(h,x,y);lt[y*N+x]=l;sum+=l;}
 const avg=sum/64;

 const gh=vapor>60?(vapor-60)*1.1:0;
 const evap=[],popList=[],newDes=[];let grew=0;let activePlantsCount=0;
 for(let i=0;i<64;i++){
  const t=tiles[i],l=lt[i];
  if(t.scaleAnim && t.scaleAnim > 1) t.scaleAnim = Math.max(1, t.scaleAnim - 0.05);

  t.T+=(20+70*l+gh-t.T)*.1;
  t.T=clamp(t.T, -50, 200);
  if(t.des){t.P=0;t.W=0;t.frozen=false;continue;}

  // Limestone decomposition check
  if(hasChem && t.limestone && t.T > 80){
   t.limestone = false;
   co2 = Math.min(100, co2 + 15);
   unlockFormula(6); // CaCO3 -> CaO + CO2
   const cx=i%N, cy=(i/N)|0;
   for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
    const nx=cx+dx, ny=cy+dy;
    if(nx>=0&&nx<N&&ny>=0&&ny<N){
     tiles[ny*N+nx].pH = clamp(tiles[ny*N+nx].pH + 2.0, 0, 14);
    }
   }
  }

  // Hydrogen explosion check
  if(hasChem && h2 > 30 && t.T > 80){
   triggerHydrogenExplosion();
   break;
  }

  t.T < 15 ? t.frozen=true : (t.T > 25 ? (t.frozen && (t.W=Math.min(100, t.W+15)), t.frozen=false) : null);

  if(t.frozen){
   t.P=Math.max(0, t.P-2);
   continue;
  }

  if(hasChem && (t.pH < 5.5 || t.pH > 8.5)){
   t.P = Math.max(0, t.P - 3);
  }

  if(t.T>70&&t.W>0){t.W=Math.max(0,t.W-2.5);vapor=Math.min(100,vapor+1.5);evap.push(i);}
  if(l>.3&&t.W>20&&t.T>=30&&t.T<=65&&(!hasChem||(t.pH>=5.5&&t.pH<=8.5))){
   const pv=t.P;
   let canGrow = !hasChem || co2 > 10;
   if(canGrow){
    t.P=Math.min(100,t.P+3);
    if(hasChem) co2 = Math.max(0, co2 - 0.05);
    o2=Math.min(60,o2+.03);t.W=Math.max(0,t.W-.5);grew++;
    activePlantsCount++;
    if(pv<25&&t.P>=25){popList.push(i);t.scaleAnim=1.4;vibrate(30);}
    unlockFormula(10); // Photosynthesis
   }
  }
  if(t.W<5||t.T>75)t.P=Math.max(0,t.P-4);
  if(t.T>85)t.hot++;else t.hot=0;
  if(t.hot>=16||(t.W<=0&&t.T>70)){t.des=true;t.P=0;t.W=0;newDes.push(i);}
 }

 if(hasChem && activePlantsCount > 0){
  unlockFormula(14); // pH scale
 }

 for(let i=0;i<64;i++){
  const t=tiles[i];
  if(!t.des&&!t.frozen&&t.P>70&&rand()<.03){
   const x=i%N,y=(i/N)|0,nb=[];
   for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){
    const X=x+d[0],Y=y+d[1];
    if(X>=0&&X<N&&Y>=0&&Y<N){const n=tiles[Y*N+X];if(!n.des&&!n.frozen&&n.P<5&&n.W>20)nb.push(n);}
   }
   if(nb.length){const picked=pick(nb);picked.P=12;picked.scaleAnim=1.3;}
  }
 }

 if(vapor>30&&avg<.35){
  vapor=Math.max(0,vapor-3);
  for(let k=0;k<3;k++){
   const j=(rand()*64)|0;
   if(!tiles[j].des&&!tiles[j].frozen){
    tiles[j].W=Math.min(100,tiles[j].W+8);
    if(hasChem && volcanoActive){
     tiles[j].pH = clamp(tiles[j].pH - 0.4, 0, 14);
     unlockFormula(8); // SO2 + H2O -> H2SO3 (Acid Rain)
    }
   }
   spawnDrop(j%N,(j/N)|0);
  }
  rainT=.6;sfx.splash();
 }

 if(vapor>=100){
  vaporOver100Timer += TICK;
  if(vaporOver100Timer >= 3 && !stormActive){
   stormActive=true;
   stormTimer=0;
   stormStrikeTimer=0;
  }
 } else {
  vaporOver100Timer=0;
 }

 if(stormActive){
  stormTimer += TICK;
  stormStrikeTimer += TICK;
  if(stormStrikeTimer >= 0.8){
   stormStrikeTimer=0;
   triggerLightning();
  }
  if(stormTimer >= 6){
   stormActive=false;
   stormTimer=0;
  }
 }

 if(evap.length){
  sfx.sizzle();
  for(let k=0;k<Math.min(5,evap.length);k++){const i=pickVisual(evap);steam(i%N,(i/N)|0,false);}
 }
 for(const i of popList){
  const [sx,sy]=proj(i%N,(i/N)|0);
  for(let k=0;k<4;k++)addP({k:'spark',x:sx,y:sy-lay.tw*.2,vx:(Math.random()-.5)*40,vy:-(30+Math.random()*40),l:0,m:.6,s:2.5});
 }
 if(popList.length)sfx.pop();
 for(const i of newDes){
  const [sx,sy]=proj(i%N,(i/N)|0);
  for(let k=0;k<4;k++)addP({k:'ember',x:sx,y:sy,vx:(Math.random()-.5)*50,vy:-(30+Math.random()*60),l:0,m:.9,s:2+Math.random()*2});
  steam(i%N,(i/N)|0,false);
 }
 if(grew&&photoCool<=0){photoT=2;photoCool=6;}

 const pl=plantList();
 if(!isSandbox){
  if(pl.length>=8&&herbs.length===0){const c=pick(pl);herbs.push(mk(c.x,c.y,60));sfx.chirpH();popAt(c.x,c.y);vibrate(40);}
  if(herbs.length>=4&&carns.length===0){
   const free=[];for(let i=0;i<64;i++)if(!tiles[i].des)free.push(i);
   if(free.length){const i=pick(free);carns.push(mk(i%N,(i/N)|0,60));sfx.chirpC();popAt(i%N,(i/N)|0);vibrate(40);unlockFormula(12);}
  }
 }

 const bornH=[];
 for(const a of herbs){
  if(a.scaleAnim > 1) a.scaleAnim = Math.max(1, a.scaleAnim - 0.05);
  a.e-=1.2;a.age++;
  if(hasChem) co2 = Math.min(100, co2 + 0.02);
  if(hasChem && o2 < 20) a.e -= 1.0;
  if(a.e<=0){a.dead=true;deathPuff(a.fx,a.fy);continue;}
  if(a.age%2===0){
   if(a.e<90){
    const tg=nearest(a,plantList());
    if(tg){
     stepToward(a,tg.x,tg.y);
     a.eyeDir={x:Math.sign(tg.x-a.x), y:Math.sign(tg.y-a.y)};
    }else wander(a);
    const t=tiles[a.y*N+a.x];
    if(t&&!t.des&&!t.frozen&&t.P>=15){t.P=Math.max(0,t.P-15);a.e=Math.min(100,a.e+20);unlockFormula(11);}
   }else if(rand()<.4)wander(a);
  }
  if(a.e>85&&herbs.length+bornH.length<6){
   a.e-=35;const c=mk(a.x,a.y,50);bornH.push(c);sfx.chirpH();popAt(a.x,a.y);vibrate(30);
   heartPuff(a.x,a.y);
  }
 }
 for(const b of bornH)herbs.push(b);

 const bornC=[];
 for(const a of carns){
  if(a.scaleAnim > 1) a.scaleAnim = Math.max(1, a.scaleAnim - 0.05);
  a.e-=1.2;a.age++;
  if(hasChem) co2 = Math.min(100, co2 + 0.03);
  if(hasChem && o2 < 20) a.e -= 1.0;
  if(a.e<=0){a.dead=true;deathPuff(a.fx,a.fy);continue;}
  if(a.age%2===0){
   const tg=nearest(a,herbs.filter(o=>!o.dead));
   if(tg&&a.e<90){
    stepToward(a,tg.x,tg.y);
    a.eyeDir={x:Math.sign(tg.x-a.x), y:Math.sign(tg.y-a.y)};
    if(a.x===tg.x&&a.y===tg.y){tg.dead=true;deathPuff(tg.fx,tg.fy);a.e=Math.min(100,a.e+40);sfx.chirpC();unlockFormula(12);}
   }else if(!tg||rand()<.4)wander(a);
  }
  if(a.e>85&&carns.length+bornC.length<3){
   a.e-=35;bornC.push(mk(a.x,a.y,50));sfx.chirpC();popAt(a.x,a.y);vibrate(30);
   heartPuff(a.x,a.y);
  }
 }
 for(const b of bornC)carns.push(b);
 herbs=herbs.filter(a=>!a.dead);carns=carns.filter(a=>!a.dead);

 if(!lowQualityMode && Math.random()<0.25){
  const j=(Math.random()*64)|0, t=tiles[j];
  if(t&&!t.des&&t.P>30){
   const [sx,sy]=proj(j%N, (j/N)|0);
   addP({k:'firefly', x:sx+(Math.random()-.5)*lay.tw, y:sy-Math.random()*30, vx:(Math.random()-.5)*8, vy:-(5+Math.random()*10), l:0, m:2+Math.random()*2, s:1.5+Math.random()});
  }
 }

 saveSnapshot();
 terrainDirty=true;

 let dc=0;for(const t of tiles)if(t.des)dc++;
 if(dc>25.6){triggerCollapse(h);return;}
 ticks++;
 if(!isSandbox && ticks>=TT)finish();
}

function finish(){
 const c=counts(),g=LEVELS[lvl] ? LEVELS[lvl].g : {p:10,h:2,c:0};
 stateT=0;

 let passChem = true;
 const L = LEVELS[lvl]||LEVELS[0];
 if(L.chem){
  let sumpH = 0; for(const t of tiles) sumpH += t.pH;
  let avgpH = sumpH / 64;
  if(lvl === 9 && (c.p < g.p || c.h < g.h || avgpH < 6 || avgpH > 8)) passChem = false;
  if(lvl === 10 && (c.p < g.p || c.h < g.h || c.c < g.c)) passChem = false;
  if(lvl === 11 && (c.p < g.p || c.h < g.h || c.c < g.c || o2 < 60 || avgpH < 6 || avgpH > 8)) passChem = false;
 }

 if(c.p>=g.p&&c.h>=g.h&&c.c>=g.c && passChem){
  state='win';sfx.win();
  let stars = 1;
  if(c.p>=g.p+2 && c.h>=g.h+2 && c.c>=g.c+2) stars = 2;
  let hasDesert = false;
  for(const t of tiles) if(t.des) hasDesert = true;
  if(stars===2 && !hasDesert) stars = 3;

  levelStars[lvl] = Math.max(levelStars[lvl], stars);
  saveStore('p_stars', levelStars);
  if(lvl < 11){
   unlockedLvl = Math.max(unlockedLvl, lvl+1);
   saveStore('p_unlocked', unlockedLvl);
  }

  if(!regretCardsUnlocked.includes(lvl)){
   regretCardsUnlocked.push(lvl);
   saveStore('p_regret', regretCardsUnlocked);
  }
  if(roomCode&&roomData&&roomData.status==='playing'){checkRaceFinish(true);}else if(dbBase()){const b=scoreBreakdown();onlineScorePayload={n:playerName,s:b.total,t:nowSrv()};onlineScoreSent=false;onlineScoreRetry=false;submitLeaderboard();}
 }
 else{state='lose';loseMsg=pickVisual(LOSE_TIME);if(roomCode&&roomData&&roomData.status==='playing')checkRaceFinish(true);}
}

function triggerCollapse(h){
 state='collapse';cT=0;shakeT=.6;flash=1;collapsed=true;cOrig={x:h.x,y:h.y};sfx.boom();vibrate(400);if(roomCode&&roomData&&roomData.status==='playing')checkRaceFinish(true);
 for(let i=0;i<60;i++)steam(Math.random()*7,Math.random()*7,true);
 for(let i=0;i<64;i++){
  const x=i%N,y=(i/N)|0,d=Math.hypot(x-h.x,y-h.y);
  for(let k=0;k<2;k++)embQ.push({t:d*.07+Math.random()*.2,x:x+Math.random()-.5,y:y+Math.random()-.5});
 }
}

// ---------- Sandbox & Tool Interactions ----------
function handleTileClick(gx, gy){
 if(gx<0||gx>=N||gy<0||gy>=N) return;
 const idx=gy*N+gx; const t=tiles[idx];
 if(!t) return;
 const L = LEVELS[lvl]||LEVELS[0];
 const hasChem = isSandbox || L.chem;

 if(sbTool==='water'){
  t.des=false; t.W=Math.min(100, t.W+40); t.frozen=false;
  spawnDrop(gx, gy); sfx.splash(); vibrate(30);
 } else if(sbTool==='plant'){
  if(!t.des){ t.P=Math.min(100, t.P+40); t.scaleAnim=1.4; popAt(gx, gy); sfx.pop(); vibrate(30); }
 } else if(sbTool==='herb'){
  herbs.push(mk(gx, gy, 70)); popAt(gx, gy); sfx.chirpH(); vibrate(30);
 } else if(sbTool==='carn'){
  carns.push(mk(gx, gy, 70)); popAt(gx, gy); sfx.chirpC(); vibrate(30);
 } else if(sbTool==='storm'){
  vapor=100; sfx.thunder(); vibrate(100);
 } else if(hasChem && sbTool==='lime' && limeCharges>0){
  limeCharges--;
  sfx.fizz();
  for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
   const nx=gx+dx, ny=gy+dy;
   if(nx>=0&&nx<N&&ny>=0&&ny<N){
    const nt=tiles[ny*N+nx];
    nt.pH = clamp(nt.pH + 1.5, 0, 14);
    nt.W = Math.min(100, nt.W + 5); // neutralization product water
   }
  }
  unlockFormula(7); // CaO + H2O -> Ca(OH)2
  vibrate(40);
 } else if(hasChem && sbTool==='elec' && elecCharges>0 && elecCool<=0 && t.W > 20){
  elecCharges--; elecCool = 8;
  t.W = Math.max(0, t.W - 30);
  o2 = Math.min(60, o2 + 8);
  h2 = Math.min(100, h2 + 10);
  sfx.bubble();
  unlockFormula(5); // 2H2O -> 2H2 + O2
  const [sx, sy] = proj(gx, gy);
  for(let k=0; k<5; k++) addP({k:'bubble', x:sx+(Math.random()-.5)*20, y:sy, vx:(Math.random()-.5)*20, vy:-(20+Math.random()*30), l:0, m:1, s:2});
  vibrate(50);
 } else if(hasChem && sbTool==='volcano'){
  t.limestone = false;
  co2 = Math.min(100, co2 + 20);
  sfx.sizzle(); vibrate(60);
 } else if(hasChem && sbTool==='limestone'){
  t.limestone = true;
  sfx.pop(); vibrate(30);
 }
 terrainDirty=true;
}

// ---------- Export Clean Image ----------
function exportCanvasImage(){
 const tempCv=document.createElement('canvas');
 tempCv.width=cv.width; tempCv.height=cv.height;
 const tCtx=tempCv.getContext('2d');
 tCtx.fillStyle='#060b11';tCtx.fillRect(0,0,tempCv.width,tempCv.height);
 tCtx.drawImage(bgCanvas, gameOffset*DPR, 0);

 tCtx.save();
 tCtx.scale(DPR, DPR);
 tCtx.translate(gameOffset, 0);
 const tw=lay.tw;
 const tN=ticks*TICK+acc;
 hs=hotspot(tN);
 const hp=proj(hs.x,hs.y), hx=hp[0], hy=hp[1];

 const Rh=(hs.r+.6)*tw*.707;
 tCtx.save();
 tCtx.globalCompositeOperation='lighter';
 tCtx.translate(hx,hy);tCtx.scale(1,.5);
 const gr=tCtx.createRadialGradient(0,0,0,0,0,Rh);
 gr.addColorStop(0,'rgba(255,240,180,0.35)');gr.addColorStop(.5,'rgba(255,180,80,0.17)');gr.addColorStop(1,'rgba(255,120,40,0)');
 tCtx.fillStyle=gr;tCtx.beginPath();tCtx.arc(0,0,Rh,0,TAU);tCtx.fill();
 tCtx.restore();

 const objs=[];
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){
  const t=tiles[y*N+x];if(t&&!t.des&&t.P>=8)objs.push({d:x+y,k:0,x:x,y:y,P:t.P,wv:t.wv,sc:t.scaleAnim||1});
 }
 for(const a of herbs)objs.push({d:a.fx+a.fy+.01,k:1,a:a,sc:a.scaleAnim||1});
 for(const a of carns)objs.push({d:a.fx+a.fy+.02,k:2,a:a,sc:a.scaleAnim||1});
 objs.sort((p,q)=>p.d-q.d);

 const oldCtx = ctx;

  else{const p=proj(o.a.fx,o.a.fy);if(o.k===1)drawHerb(p[0],p[1],o.a,o.sc);else drawCarn(p[0],p[1],o.a,o.sc);}
 }
 ctx = oldCtx;
 tCtx.restore();

 tCtx.font='700 '+(16*S*DPR)+'px '+FONT_STACK;
 tCtx.fillStyle='rgba(255,255,255,0.75)';
 tCtx.textAlign='right';
 tCtx.fillText('Hệ Sinh Thái Hành Tinh Xanh', tempCv.width - 20*DPR, tempCv.height - 20*DPR);

 tempCv.toBlob(blob => {

  const url=URL.createObjectURL(blob);

  a.href=url; a.download='hanh-tinh-xanh-regret.png';

 }, 'image/png');
}

function updParts(dt){
 for(let i=0;i<parts.length;i++){
  const p=parts[i];
  p.l+=dt;
  if(p.k==='drop'){p.y+=p.vy*dt;if(p.y>=p.ty){p.l=p.m;addP({k:'splash',x:p.x,y:p.ty,l:0,m:.5});}}
  else{p.x+=(p.vx||0)*dt;p.y+=(p.vy||0)*dt;if(p.k==='ember')p.vy+=20*dt;}

// ---------- Drawing Helpers & Palette ----------
function rr(c,x,y,w,h,r){
 r=Math.min(r,w/2,h/2);c.beginPath();c.moveTo(x+r,y);
 c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();
}
function txt(s,x,y,size,col,al,wt){
 ctx.font=(wt||'400')+' '+Math.max(12, size)+'px '+FONT_STACK;
 ctx.fillStyle=col;ctx.textAlign=al||'left';ctx.fillText(s,x,y);
}

function formulaSource(raw){
 return String(raw)
  .replace(/\\xrightarrow(?:\{[^}]*\})?/g,' → ')
  .replace(/\\rightarrow/g,' → ')
  .replace(/\\rightleftharpoons/g,' ⇌ ')
  .replace(/\\propto/g,' ∝ ')
  .replace(/\\approx/g,' ≈ ')
  .replace(/\\Delta/g,'Δ')
  .replace(/\\sum/g,'Σ')
  .replace(/\\cdot/g,' · ')
  .replace(/\\frac\{([^{}]+)\}\{([^{}]+)\}/g,'($1/$2)')
  .replace(/\\log\b/g,'log')
  .replace(/\\_/g,'_')
  .replace(/\\[a-zA-Z]+/g,'')
  .replace(/\s+/g,' ').trim();
}
function formulaText(raw,x,y,size,col,al,wt){
 const str=formulaSource(raw),weight=wt||'400',base=Math.max(12,size),runs=[];
 for(let i=0;i<str.length;){
  if(str[i]==='_'||str[i]==='^'){
   const isSup=str[i]==='^';let j=i+1,value='';
   if(str[j]==='{'){
    const end=str.indexOf('}',j+1);
    if(end>=0){value=str.slice(j+1,end);i=end+1;}
    else{runs.push({text:str[i],size:base,dy:0});i++;continue;}
   }else if(j<str.length&&/[0-9]/.test(str[j])){
    while(j<str.length&&/[0-9]/.test(str[j]))value+=str[j++];
    i=j;
   }else if(j<str.length){
    value=str[j];i=j+1;
   }else{
    runs.push({text:str[i],size:base,dy:0});i++;continue;
   }
   if(value)runs.push({text:value,size:Math.max(8,base*.66),dy:isSup?-base*.34:base*.22});
   continue;
  }
  let j=i;
  while(j<str.length&&str[j]!=='_'&&str[j]!=='^')j++;
  runs.push({text:str.slice(i,j),size:base,dy:0});i=j;
 }
 ctx.save();
 ctx.fillStyle=col;ctx.textAlign='left';ctx.textBaseline='alphabetic';
 let total=0;
 for(const run of runs){ctx.font=weight+' '+run.size+'px '+FONT_STACK;run.width=ctx.measureText(run.text).width;total+=run.width;}
 let px=(al||'left')==='center'?x-total/2:(al||'left')==='right'?x-total:x;
 for(const run of runs){ctx.font=weight+' '+run.size+'px '+FONT_STACK;ctx.fillText(run.text,px,y+run.dy);px+=run.width;}
 ctx.restore();
}
function circ(c,x,y,r){c.beginPath();c.arc(x,y,Math.max(0.1,r),0,TAU);c.fill();}
function ell(c,x,y,rx,ry){c.beginPath();c.ellipse(x,y,Math.max(0.1,rx),Math.max(0.1,ry),0,0,TAU);c.fill();}
function lerpC(a,b,t){t=clamp(t,0,1);return [a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t];}
function rgb(c,k){k=clamp(k,0,1);return 'rgb('+((c[0]*k)|0)+','+((c[1]*k)|0)+','+((c[2]*k)|0)+')';}

const C_DRY=[185,142,95], C_WET=[72,118,88], C_DES=[210,185,125], C_ICE=[190,230,250];

// ---------- Sprite Pre-rendering ----------
function buildTileSprites(){
 const tw=lay.tw, th=lay.th, hw=tw/2, hh=th/2;
 const dep=tw*0.35;
 const types=['dry','wet','des','ice'];
 types.forEach(type=>{
  const sCv=document.createElement('canvas');
  sCv.width=Math.ceil((tw+4)*DPR); sCv.height=Math.ceil((th+dep+6)*DPR);
  const sCtx=sCv.getContext('2d'); sCtx.scale(DPR, DPR);
  
  let c=C_DRY;
  if(type==='wet') c=C_WET;
  if(type==='des') c=C_DES;
  if(type==='ice') c=C_ICE;

  const cx=hw+2, cy=hh+2;

  sCtx.fillStyle=rgb(c,.42);
  sCtx.beginPath();sCtx.moveTo(cx-hw,cy);sCtx.lineTo(cx,cy+hh);sCtx.lineTo(cx,cy+hh+dep);sCtx.lineTo(cx-hw,cy+dep);sCtx.closePath();sCtx.fill();

  sCtx.fillStyle=rgb(c,.58);
  sCtx.beginPath();sCtx.moveTo(cx+hw,cy);sCtx.lineTo(cx,cy+hh);sCtx.lineTo(cx,cy+hh+dep);sCtx.lineTo(cx+hw,cy+dep);sCtx.closePath();sCtx.fill();

  sCtx.fillStyle=rgb(c,1);
  sCtx.beginPath();sCtx.moveTo(cx,cy-hh);sCtx.lineTo(cx+hw,cy);sCtx.lineTo(cx,cy+hh);sCtx.lineTo(cx-hw,cy);sCtx.closePath();sCtx.fill();

  sCtx.strokeStyle='rgba(255,255,255,0.25)'; sCtx.lineWidth=1; sCtx.stroke();

  if(type==='des'){   sCtx.strokeStyle='rgba(90,70,50,0.35)'; sCtx.lineWidth=1;
   sCtx.beginPath(); sCtx.moveTo(cx-hw*0.3, cy-hh*0.2); sCtx.lineTo(cx, cy); sCtx.lineTo(cx+hw*0.2, cy+hh*0.4); sCtx.stroke();
  }

  tileSprites[type]=sCv;
 });
}

// ---------- Lifeforms & Terrain ----------
function drawPlant(cx,cy,P,wv,sc=1,x=0,y=0){
 P*=(1-wv);if(P<3)return;
 const tw=lay.tw,k=P/100;
 const sway=Math.sin(tAll*2.5 + x*1.3 + y*0.8)*tw*0.04*k;
 ctx.save(); ctx.translate(cx, cy); ctx.scale(sc, sc);

 ctx.fillStyle='rgba(10,20,30,0.35)';
 ell(ctx, 0, tw*0.05, tw*(0.15+0.2*k), tw*(0.08+0.1*k));

 if(P<25){
  ctx.fillStyle='#80c060'; circ(ctx, sway*0.5, -tw*0.08, tw*(0.05+0.06*P/25));
  ctx.restore(); return;
 } else if(P<60){
  const hg=tw*(0.3+0.3*k), w=tw*(0.15+0.15*k);
  ctx.fillStyle='#5c4028'; ctx.fillRect(-w*0.15, -hg*0.4, w*0.3, hg*0.4);
  ctx.fillStyle='#4aa255'; circ(ctx, sway*0.6, -hg*0.5, w*0.7);
  ctx.fillStyle='#7cd880'; circ(ctx, sway*0.8, -hg*0.7, w*0.5);
  ctx.restore(); return;
 }

 const hg=tw*(0.35+0.45*k), w=tw*(0.18+0.2*k);
 ctx.fillStyle='#5c4028';
 ctx.beginPath();ctx.moveTo(-w*0.2,0);ctx.lineTo(w*0.2,0);ctx.lineTo(sway*0.5,-hg*0.55);ctx.lineTo(-w*0.2+sway*0.5,-hg*0.55);ctx.closePath();ctx.fill();

 const c1=rgb([35,110,55],1), c2=rgb([65,155,75],1), c3=rgb([100,190,95],1);
 ctx.fillStyle=c1; circ(ctx, sway*0.6, -hg*0.55, w*0.85);
 ctx.fillStyle=c2; circ(ctx, sway*0.8 - w*0.25, -hg*0.75, w*0.65); circ(ctx, sway*0.8 + w*0.25, -hg*0.75, w*0.65);
 ctx.fillStyle=c3; circ(ctx, sway - w*0.1, -hg*0.95, w*0.5);

 if(P>85){
  ctx.fillStyle='#ff5d73'; circ(ctx, sway - w*0.3, -hg*0.8, tw*0.04);
  circ(ctx, sway + w*0.2, -hg*0.65, tw*0.04);
  ctx.fillStyle='#ffe260'; circ(ctx, sway + w*0.1, -hg*0.9, tw*0.035);
 }

 ctx.restore();
}

function drawHerb(cx,cy,a,sc=1){
 const s=lay.tw*.22;
 const hop=Math.abs(Math.sin(tAll*6 + a.x*1.7 + a.y))*s*0.2;
 ctx.save(); ctx.translate(cx, cy - hop); ctx.scale(sc, sc);
 ctx.globalAlpha=clamp(a.a,0,1);

 ctx.fillStyle='rgba(10,20,30,0.25)'; ell(ctx,0,hop,s*0.85,s*0.38);

 ctx.fillStyle='#dcefff'; ctx.strokeStyle='#9bc2de'; ctx.lineWidth=1.5;
 ctx.beginPath(); ctx.ellipse(0, -s*0.7, s*0.8, s*0.65, 0, 0, TAU); ctx.fill(); ctx.stroke();
 ctx.fillStyle='#ffffff'; ell(ctx, 0, -s*0.55, s*0.5, s*0.35);

 const earWiggle=Math.sin(tAll*10 + a.x)*0.08;
 ctx.fillStyle='#dcefff';
 ctx.beginPath(); ctx.ellipse(-s*0.4, -s*1.35, s*0.2, s*0.45, -0.2+earWiggle, 0, TAU); ctx.fill(); ctx.stroke();
 ctx.beginPath(); ctx.ellipse(s*0.4, -s*1.35, s*0.2, s*0.45, 0.2+earWiggle, 0, TAU); ctx.fill(); ctx.stroke();

 a.blinkT = (a.blinkT || 0) + 0.02;
 const blink = Math.sin(a.blinkT) > 0.96 ? 0.1 : 1;
 const lookX = (a.eyeDir ? a.eyeDir.x : 0) * s * 0.05;
 const lookY = (a.eyeDir ? a.eyeDir.y : 0) * s * 0.05;

 ctx.fillStyle='#1e3245';
 ell(ctx, -s*0.3 + lookX, -s*0.75 + lookY, s*0.12, s*0.14*blink);
 ell(ctx, s*0.3 + lookX, -s*0.75 + lookY, s*0.12, s*0.14*blink);

 ctx.globalAlpha=1; ctx.restore();
}

function drawCarn(cx,cy,a,sc=1){
 const s=lay.tw*.24;
 const hop=Math.abs(Math.sin(tAll*7 + a.x*1.2 + a.y*1.5))*s*0.25;
 ctx.save(); ctx.translate(cx, cy - hop); ctx.scale(sc, sc);
 ctx.globalAlpha=clamp(a.a,0,1);

 ctx.fillStyle='rgba(10,20,30,0.25)'; ell(ctx,0,hop,s*0.85,s*0.38);

 ctx.fillStyle='#f07038'; ctx.strokeStyle='#aa3d12'; ctx.lineWidth=1.5;
 ctx.beginPath(); ctx.ellipse(0, -s*0.65, s*0.85, s*0.6, 0, 0, TAU); ctx.fill(); ctx.stroke();

 ctx.fillStyle='#aa3d12';
 ctx.beginPath(); ctx.moveTo(-s*0.2, -s*0.95); ctx.lineTo(0, -s*0.8); ctx.lineTo(s*0.2, -s*0.95); ctx.fill();

 ctx.fillStyle='#f07038';
 ctx.beginPath(); ctx.moveTo(-s*0.6, -s*0.9); ctx.lineTo(-s*0.8, -s*1.4); ctx.lineTo(-s*0.2, -s*1.0); ctx.closePath(); ctx.fill(); ctx.stroke();
 ctx.beginPath(); ctx.moveTo(s*0.6, -s*0.9); ctx.lineTo(s*0.8, -s*1.4); ctx.lineTo(s*0.2, -s*1.0); ctx.closePath(); ctx.fill(); ctx.stroke();

 const lookX = (a.eyeDir ? a.eyeDir.x : 0) * s * 0.05;
 ctx.fillStyle='#2b1005';
 ell(ctx, -s*0.32 + lookX, -s*0.65, s*0.1, s*0.12);
 ell(ctx, s*0.32 + lookX, -s*0.65, s*0.1, s*0.12);
 circ(ctx, 0, -s*0.45, s*0.12);

 ctx.globalAlpha=1; ctx.restore();

function drawCloud(vap=vapor){
 if(vap<1)return;
 const tw=lay.tw,k=.25+vap/100*1.1,R=tw*1.0*k;
 const cx=lay.cx+Math.sin(tAll*.25)*tw*1.5,cy=lay.oy-lay.th*.5-tw*.9;
 const wet=rainT>0||stormActive;
 ctx.fillStyle=wet?'rgba(90,110,135,'+(.75+vap*.002)+')':'rgba(240,248,255,'+(.65+vap*.003)+')';
 const o=[[-1,.2,.6],[-.4,-.3,.7],[.3,-.1,.75],[1,.25,.55],[0,.2,.8]];
 for(const c of o)circ(ctx, cx+c[0]*R, cy+c[1]*R, R*c[2]);
}

function renderTerrainToBuffer(){
 bgCtx.clearRect(0,0,bgCanvas.width,bgCanvas.height);
 bgCtx.save(); bgCtx.scale(DPR, DPR);

 const tw=lay.tw,th=lay.th,hw=tw/2,hh=th/2;
 const depBase=tw*0.35;
 const floatY=Math.sin(tAll*1.8)*3;

 const centerP=proj(3.5, 3.5);
 const islandWidth=N*tw, islandHeight=N*th;
 bgCtx.fillStyle='rgba(5,10,15,0.45)';
 ell(bgCtx, centerP[0], centerP[1]+islandHeight*0.4, islandWidth*0.5, islandHeight*0.25);

 bgCtx.fillStyle='#2d2018';
 bgCtx.beginPath();
 bgCtx.moveTo(lay.ox - 4*hw, lay.oy + 4*hh + floatY);
 bgCtx.lineTo(lay.ox, lay.oy + 8*hh + floatY);
 bgCtx.lineTo(lay.ox + 4*hw, lay.oy + 4*hh + floatY);
 bgCtx.lineTo(lay.ox, lay.oy + 8*hh + floatY + tw*2.2);
 bgCtx.closePath(); bgCtx.fill();

 for(let s=0;s<=14;s++)for(let x=0;x<N;x++){
  const y=s-x;if(y<0||y>=N)continue;
  const t=tiles[y*N+x]||{T:30,W:50,P:0,pH:7,limestone:false,des:false,hot:0,wv:0,frozen:false};

  let wv=0;
  if(collapsed&&!t.des)wv=clamp((cT-Math.hypot(x-cOrig.x,y-cOrig.y)*.07)/.4,0,1);

  const elev = t.des ? -th*0.15 : (t.W > 40 ? th*0.1 : 0);
  const p=proj(x,y), cx=p[0], cy=p[1] + elev;

  let spriteKey='dry';
  if(t.des) spriteKey='des';
  else if(t.frozen) spriteKey='ice';
  else if(t.W > 40) spriteKey='wet';

  const sp=tileSprites[spriteKey];
  if(sp){
   bgCtx.drawImage(sp, (cx - hw - 2), (cy - hh - 2), (tw + 4), (th + depBase + 6));
  }

  // pH Tint overlay
  const L=LEVELS[lvl]||LEVELS[0];
  if((isSandbox || L.chem) && !t.des){
   if(t.pH < 5.5){
    bgCtx.fillStyle='rgba(180,255,80,0.25)';
    bgCtx.beginPath();bgCtx.moveTo(cx,cy-hh);bgCtx.lineTo(cx+hw,cy);bgCtx.lineTo(cx,cy+hh);bgCtx.lineTo(cx-hw,cy);bgCtx.closePath();bgCtx.fill();
   } else if(t.pH > 8.5){
    bgCtx.fillStyle='rgba(120,120,255,0.25)';
    bgCtx.beginPath();bgCtx.moveTo(cx,cy-hh);bgCtx.lineTo(cx+hw,cy);bgCtx.lineTo(cx,cy+hh);bgCtx.lineTo(cx-hw,cy);bgCtx.closePath();bgCtx.fill();
   }
  }

  if(t.limestone){
   bgCtx.fillStyle='#ffffff';
   circ(bgCtx, cx, cy, tw*0.15);
  }

  if(!t.des && t.W > 40){
   const sheen = Math.sin(tAll*3 + x + y)*0.15 + 0.15;
   bgCtx.fillStyle='rgba(120,200,255,'+sheen+')';
   bgCtx.beginPath();bgCtx.moveTo(cx,cy-hh);bgCtx.lineTo(cx+hw,cy);bgCtx.lineTo(cx,cy+hh);bgCtx.lineTo(cx-hw,cy);bgCtx.closePath();bgCtx.fill();
  }

  if(t.T > 65){
   const heatGlow = Math.min(0.5, (t.T - 65)/50);
   bgCtx.fillStyle='rgba(255,80,30,'+(heatGlow*(0.6+0.4*Math.sin(tAll*8)))+')';
   bgCtx.beginPath();bgCtx.moveTo(cx,cy-hh);bgCtx.lineTo(cx+hw,cy);bgCtx.lineTo(cx,cy+hh);bgCtx.lineTo(cx-hw,cy);bgCtx.closePath();bgCtx.fill();
  }
 }
 bgCtx.restore();
 terrainDirty=false;
}

// ---------- World Render & Lens ----------
function drawWorld(){
 if(isReplaying){ drawReplayWorld(); return; }

 const now = performance.now();
 if(terrainDirty || (!drag && now - lastTerrainDraw > 200)){
  renderTerrainToBuffer();
  lastTerrainDraw = now;
 }
 ctx.drawImage(bgCanvas, 0, 0, cv.width/DPR, cv.height/DPR);

 const tw=lay.tw;
 const tN=state==='play'?ticks*TICK+acc:ticks*TICK;
 hs=hotspot(tN);

 const hp=proj(hs.x,hs.y), hx=hp[0], hy=hp[1];

 const lensX=W/2, lensY=20*S;
 ctx.fillStyle='#1e2d3b'; circ(ctx, lensX, lensY, 28*S);
 ctx.fillStyle='#ffe28a'; circ(ctx, lensX, lensY, 22*S);
 ctx.fillStyle='rgba(255,255,255,0.8)'; circ(ctx, lensX - 6*S, lensY - 6*S, 6*S);

 const beamGrad = ctx.createLinearGradient(lensX, lensY, hx, hy);
 beamGrad.addColorStop(0, 'rgba(255,230,150,0.35)');
 beamGrad.addColorStop(1, 'rgba(255,180,80,0.02)');
 ctx.fillStyle=beamGrad;
 const beamHalfWidth=Math.min(tw*4.4,Math.max(tw*1.8,(hs.r+1)*tw*.707));
 ctx.beginPath(); ctx.moveTo(lensX-15*S, lensY); ctx.lineTo(lensX+15*S, lensY); ctx.lineTo(hx+beamHalfWidth, hy); ctx.lineTo(hx-beamHalfWidth, hy); ctx.closePath(); ctx.fill();

 const Rh=(hs.r+.6)*tw*.707;
 ctx.save();
 ctx.globalCompositeOperation='lighter';
 ctx.translate(hx,hy);ctx.scale(1,.5);
 const gr=ctx.createRadialGradient(0,0,0,0,0,Rh);
 const a0=.35+.35*(hs.peak/1.5);
 gr.addColorStop(0,'rgba(255,240,180,'+a0+')');gr.addColorStop(.5,'rgba(255,180,80,'+(a0*.5)+')');gr.addColorStop(1,'rgba(255,120,40,0)');
 ctx.fillStyle=gr;ctx.beginPath();ctx.arc(0,0,Rh,0,TAU);ctx.fill();
 ctx.restore();

 if(flareWarn || flareActive){
  for(let dy=-1;dy<=1;dy++){
   for(let dx=-1;dx<=1;dx++){
    const fx=flarePos.x+dx, fy=flarePos.y+dy;
    if(fx>=0&&fx<N&&fy>=0&&fy<N){
     const [pX,pY]=proj(fx,fy);
     ctx.fillStyle=flareActive?'rgba(255,80,0,0.42)':'rgba(255,200,0,'+(0.25+0.15*Math.sin(tAll*10))+')';

function hitInputControl(x,y){

 for(const b of btns){if(x>=b.x&&x<=b.x+b.w&&y>=b.y&&y<=b.y+b.h){const score=Math.hypot(x-(b.x+b.w/2),y-(b.y+b.h/2));if(score<bestScore){best={type:'button',control:b};bestScore=score;}}}

}

document.addEventListener('keyup',e=>heldKeys.delete(e.key.toLowerCase()));
window.addEventListener('blur',()=>{heldKeys.clear();if(state==='play'&&!(roomCode&&roomData&&roomData.status==='playing')){pauseReturnState='play';state='paused';pauseReason='Đã tạm dừng khi mất tiêu điểm';}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){heldKeys.clear();if(state==='play'&&!(roomCode&&roomData&&roomData.status==='playing')){pauseReturnState='play';state='paused';pauseReason='Đã tạm dừng khi chuyển tab';}}else if(AC&&AC.state==='suspended')try{AC.resume();}catch(_){}});
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{if(AC&&AC.state==='suspended')try{AC.resume();}catch(_){}},{passive:true}));
const hintDismissed=loadStore('p_keyhint_dismissed',false);
let keyHintClosed=!!hintDismissed;
function drawKeyboardHints(){
 if(!finePointer()||keyHintClosed||W<650)return;
 const text='A/D: Góc chiếu   W/S: Tiêu cự   Space: Tạm dừng   R: Chơi lại   M: Âm thanh   F: Toàn màn hình';
 ctx.font='12px '+FONT_STACK;const w=Math.min(W-24,ctx.measureText(text).width+30);
 rr(ctx,(W-w)/2,H-88*S,w,27,8);ctx.fillStyle='rgba(5,12,20,.82)';ctx.fill();
 txt(text,W/2,H-70*S,12,'#d9e8ef','center','500');
 button('x',W-(w/2)-12,H-74*S,24,24,()=>{keyHintClosed=true;saveStore('p_keyhint_dismissed',true);},'#e6b35a');
}

// ---------- Main Game Loop ----------
let last=0,backgroundGradient=null,backgroundGradientKey='';
function frame(ts){
 try{
  const dt=Math.min(.1,(ts-last)/1000||0);last=ts;
  tAll+=dt;stateT+=dt;
   if(state==='play'&&heldKeys.size){
    for(const [key,held] of heldKeys){const age=held+dt;heldKeys.set(key,age);const accel=age>.4?Math.min(2.5,1+(age-.4)*1.8):1;const step=dt*.22*accel;
     if(key==='arrowleft'||key==='a')s1=clamp(s1-step,0,1);
     if(key==='arrowright'||key==='d')s1=clamp(s1+step,0,1);
     if(key==='arrowup'||key==='w')s2=clamp(s2+step,0,1);
     if(key==='arrowdown'||key==='s')s2=clamp(s2-step,0,1);
    }
   }

  if(pendingSliderValue!==null&&drag){const sl=controlLayout.sliders[drag.i];if(sl){const v=pendingSliderValue;pendingSliderValue=null;if(drag.i===0){if(Math.abs(s1-v)>0.00001){s1=v;unlockFormula(1);}}else s2=v;}}

  frameTimeHistory.push(dt);
  if(frameTimeHistory.length > 30){
   frameTimeHistory.shift();
   const avgDt = frameTimeHistory.reduce((a,b)=>a+b,0)/30;
   if(avgDt > 0.024) lowQualityMode=true;
  }

  if(isReplaying){
   replayTimer += dt;
   if(replayTimer >= 0.28){
    replayTimer = 0; replayIdx++;
    if(replayIdx >= ringSize){ isReplaying=false; }
   }
  }

  photoT=Math.max(0,photoT-dt);photoCool=Math.max(0,photoCool-dt);rainT=Math.max(0,rainT-dt);
  flash=Math.max(0,flash-dt/.9);shakeT=Math.max(0,shakeT-dt);
  if(state==='racecount'&&roomData&&roomData.status==='playing'){raceCountdown=Math.max(0,(roomData.startAt-nowSrv())/1000);if(raceCountdown<=0)beginRace(Object.assign({},roomData,{startAt:nowSrv()}));}
  if(state==='play'&&roomCode&&roomData&&roomData.status==='playing'&&ticks*TICK>=DUR&&!raceFinishAt)checkRaceFinish(true);
  if(state==='play' && !isReplaying && !codexOpen && !minigameData){
   hintT+=dt;acc+=dt * (isSandbox ? simSpeed : 1);let n=0;
   while(acc>=TICK&&state==='play'&&n++<6){acc-=TICK;tick();}
   if(state!=='play')acc=0;
   if(rainT>0&&rand()<dt*25){const j=(rand()*64)|0;spawnDrop(j%N,(j/N)|0);}
  }else if(state==='collapse'){
   cT+=dt;
   for(let i=embQ.length-1;i>=0;i--){
    if(embQ[i].t<=cT){
     const q=embQ.splice(i,1)[0],p=proj(q.x,q.y);
     addP({k:'ember',x:p[0],y:p[1],vx:(Math.random()-.5)*40,vy:-(50+Math.random()*110),l:0,m:1+Math.random()*8,s:2+Math.random()*3});
    }
   }
   if(Math.random()<dt*40)steam(Math.random()*7,Math.random()*7,true);
   for(const a of herbs)a.a=Math.max(0,1-cT/1.2);
   for(const a of carns)a.a=Math.max(0,1-cT/1.2);
   if(cT>=1.5){
    if(isSandbox){
     startLevel(0, true);
     loseMsg=pickVisual(SANDBOX_RESET_MSG);
    } else {
     state='lose';stateT=0;loseMsg=pickVisual(LOSE_COL);
    }
   }
  }
  const k=Math.min(1,dt*7);
  for(const a of herbs){a.fx+=(a.x-a.fx)*k;a.fy+=(a.y-a.fy)*k;}
  for(const a of carns){a.fx+=(a.x-a.fx)*k;a.fy+=(a.y-a.fy)*k;}
  updParts(dt);

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle='#060b11';ctx.fillRect(0,0,VIEWW,H);
  ctx.save();ctx.translate(gameOffset,0);
  btns.length=0;controlLayout.sliders.length=0;

  const nightMode=!isSandbox&&LEVELS[lvl]&&LEVELS[lvl].dn&&state==='play';
  const bgKey=W+'x'+H+'|'+(nightMode?Math.round(dayNightFactor*1000):'normal');
  if(!backgroundGradient||backgroundGradientKey!==bgKey){
   backgroundGradient=ctx.createLinearGradient(0,0,0,H);
   if(nightMode){const dnK=dayNightFactor;backgroundGradient.addColorStop(0,rgb([10*dnK,15*dnK,28*dnK],1));backgroundGradient.addColorStop(.55,rgb([18*dnK,28*dnK,45*dnK],1));backgroundGradient.addColorStop(1,rgb([8*dnK,12*dnK,20*dnK],1));}
   else{backgroundGradient.addColorStop(0,'#060b11');backgroundGradient.addColorStop(.55,'#122232');backgroundGradient.addColorStop(1,'#081018');}
   backgroundGradientKey=bgKey;
  }
  ctx.fillStyle=backgroundGradient;ctx.fillRect(0,0,W,H);

  ctx.fillStyle='rgba(255,255,255,0.25)';
  for(let i=0;i<25;i++){
   const sx=((i*137)%W), sy=((i*219)%H);
   const twinkle=Math.sin(tAll*3 + i)*0.5 + 0.5;
   ctx.fillStyle='rgba(255,255,255,'+(0.1 + 0.3*twinkle)+')';
   ctx.fillRect(sx, sy, 1.5*S, 1.5*S);
  }

  const px=W*0.82, py=H*0.18;
  ctx.fillStyle='rgba(200,230,255,0.12)'; circ(ctx, px, py, 30*S);
  ctx.strokeStyle='rgba(200,230,255,0.08)'; ctx.lineWidth=2;
  ell(ctx, px, py, 45*S, 10*S);

  ctx.save();
  if(shakeT>0){const m=10*S*(shakeT/.6);ctx.translate((Math.random()-.5)*m,(Math.random()-.5)*m);}
  drawWorld();
  ctx.restore();

  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*.65)+')';ctx.fillRect(0,0,W,H);}
  if(textReady){if(state==='play'||state==='paused'||state==='collapse'){drawHUD();drawControls();}if(roomCode&&roomData&&roomData.status==='playing'&&state==='play')drawRaceHud();drawOverlay();if(state==='play')drawKeyboardHints();
    if(state==='paused'){ctx.fillStyle='rgba(3,8,14,.82)';ctx.fillRect(0,0,W,H);txt('Đã tạm dừng',W/2,H*.42,28*S,'#bfffd0','center','800');txt(pauseReason||'Nhấn Space để tiếp tục',W/2,H*.48,14*S,'#fff','center','500');button('Tiếp tục',W/2,H*.58,150*S,44*S,togglePause,'#7fe3a0');button('Chơi lại',W/2,H*.67,150*S,40*S,()=>startLevel(lvl,isSandbox),'#ffd36b');}
   }

  if(codexOpen) drawCodex();
  if(minigameData) drawMinigame();
  ctx.restore();

 }catch(err){
  console.error("Game loop frame recovery:", err);
 }
 requestAnimationFrame(frame);
}

let resizeTimer=0;
const scheduleResize=()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(resize,100);};
window.addEventListener('resize',scheduleResize);window.addEventListener('orientationchange',scheduleResize);window.addEventListener('scroll',()=>{canvasRect=cv.getBoundingClientRect();},{passive:true});
if(window.visualViewport){window.visualViewport.addEventListener('resize',scheduleResize);window.visualViewport.addEventListener('scroll',()=>{canvasRect=cv.getBoundingClientRect();},{passive:true});}
resize();
state='menu';stateT=0;
if(dbConfigured())probeOnline().then(()=>{});else{onlineReachable=false;onlineNote=ONLINE_OFFLINE_NOTE;}
requestAnimationFrame(frame);
})();
</script>
